<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>D.T.B. DRIVE</title>

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
 user-select:none;
 -webkit-user-select:none;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:#000;
 font-family:Arial,sans-serif;
}
canvas{
 position:fixed;
 inset:0;
 display:block;
}
#menu{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 background:
 radial-gradient(circle at 50% 40%,#243642 0,#090d11 52%,#000 100%);
 color:white;
}
.logo{
 font-size:clamp(50px,12vw,110px);
 font-weight:900;
 letter-spacing:12px;
 text-shadow:0 0 20px #00aaff,0 0 60px #0066ff;
}
.studio{
 margin-top:4px;
 color:#aaa;
 letter-spacing:7px;
 font-size:12px;
}
#start{
 margin-top:42px;
 width:min(360px,82vw);
 padding:18px;
 border-radius:14px;
 border:1px solid #188cff;
 background:#0877c922;
 color:white;
 font-size:19px;
 font-weight:900;
}
#start:disabled{
 opacity:.45;
}
#start:not(:disabled):active{
 transform:scale(.96);
 background:#0877c966;
}
#loading{
 margin-top:14px;
 font-size:12px;
 color:#aaa;
}
#gameUI{
 display:none;
 position:fixed;
 inset:0;
 z-index:10;
 pointer-events:none;
 color:white;
}
#speed{
 position:absolute;
 left:20px;
 top:16px;
 font-size:30px;
 font-weight:900;
 text-shadow:0 2px 8px #000;
}
#rpm{
 font-size:11px;
 color:#bbb;
 margin-top:2px;
}
#damageBox{
 position:absolute;
 right:20px;
 top:20px;
 width:150px;
 height:9px;
 border:1px solid #aaa;
 background:#222;
 border-radius:20px;
 overflow:hidden;
}
#damage{
 width:0%;
 height:100%;
 background:#f22;
}
#camName{
 position:absolute;
 right:20px;
 top:38px;
 font-size:11px;
 color:#ddd;
}
#controls{
 display:none;
 position:fixed;
 inset:0;
 z-index:20;
 pointer-events:none;
}
#wheel{
 pointer-events:auto;
 touch-action:none;
 position:absolute;
 left:24px;
 bottom:23px;
 width:140px;
 height:140px;
 border:6px solid #ffffff77;
 border-radius:50%;
 background:#0005;
}
#wheel:before,
#wheel:after{
 content:"";
 position:absolute;
 background:#ffffff88;
}
#wheel:before{
 width:5px;
 height:112px;
 left:62px;
 top:8px;
}
#wheel:after{
 width:112px;
 height:5px;
 left:8px;
 top:62px;
}
#knob{
 position:absolute;
 width:54px;
 height:54px;
 left:37px;
 top:37px;
 border:4px solid white;
 border-radius:50%;
 background:#ffffff18;
}
.pedal{
 pointer-events:auto;
 touch-action:none;
 position:absolute;
 right:22px;
 bottom:22px;
 width:82px;
 height:118px;
 border-radius:16px;
 border:2px solid #ffffff66;
 background:#0008;
 color:white;
 font-weight:900;
}
#brake{
 right:120px;
 height:88px;
}
.ctrl{
 pointer-events:auto;
 position:absolute;
 right:20px;
 width:70px;
 height:38px;
 border:1px solid #aaa;
 border-radius:10px;
 color:white;
 background:#0009;
}
#cam{
 top:70px;
}
#pause{
 top:115px;
}
#pauseScreen{
 display:none;
 position:fixed;
 inset:0;
 z-index:200;
 background:#000b;
 color:white;
 align-items:center;
 justify-content:center;
 flex-direction:column;
}
#pauseScreen h1{
 font-size:48px;
 margin-bottom:20px;
}
#resume{
 padding:14px 35px;
 border:0;
 border-radius:10px;
 background:#087bd8;
 color:white;
 font-weight:bold;
}
</style>
</head>

<body>

<div id="menu">
 <div class="logo">D.T.B.</div>
 <div class="studio">DRIVE // STUDIO</div>
 <button id="start" disabled>LOADING 3D...</button>
 <div id="loading">3D ENGINE 준비 중...</div>
</div>

<div id="gameUI">
 <div id="speed">
  0 KM/H
  <div id="rpm">RPM 800</div>
 </div>

 <div id="damageBox">
  <div id="damage"></div>
 </div>

 <div id="camName">THIRD PERSON</div>
</div>

<div id="controls">

 <div id="wheel">
  <div id="knob"></div>
 </div>

 <button class="pedal" id="gas">GAS</button>
 <button class="pedal" id="brake">BRAKE</button>

 <button class="ctrl" id="cam">CAM</button>
 <button class="ctrl" id="pause">Ⅱ</button>

</div>

<div id="pauseScreen">
 <h1>PAUSED</h1>
 <button id="resume">CONTINUE</button>
</div>

<!-- Three.js -->
<script
 id="threeScript"
 src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js">
</script>

<script>
/* =====================================================
   D.T.B. DRIVE
   ===================================================== */

let scene;
let camera;
let renderer;
let car;
let traffic=[];
let wheels=[];

let started=false;
let paused=false;
let cameraMode=0;

let speed=0;
let steering=0;
let throttle=0;
let braking=0;
let damage=0;

let clock=new THREE.Clock();

/* =====================================================
   MATERIAL
   ===================================================== */

const bodyMat=new THREE.MeshStandardMaterial({
 color:0x172b3d,
 metalness:.9,
 roughness:.23
});

const bodyDark=new THREE.MeshStandardMaterial({
 color:0x0c1a26,
 metalness:.85,
 roughness:.2
});

const blackMat=new THREE.MeshStandardMaterial({
 color:0x030405,
 metalness:.3,
 roughness:.3
});

const glassMat=new THREE.MeshStandardMaterial({
 color:0x071923,
 metalness:.4,
 roughness:.08,
 transparent:true,
 opacity:.68
});

const chromeMat=new THREE.MeshStandardMaterial({
 color:0xaaaaaa,
 metalness:1,
 roughness:.12
});

const tireMat=new THREE.MeshStandardMaterial({
 color:0x050505,
 roughness:.9
});

const lightMat=new THREE.MeshStandardMaterial({
 color:0xffffff,
 emissive:0xffffff,
 emissiveIntensity:5
});

const redMat=new THREE.MeshStandardMaterial({
 color:0xff1111,
 emissive:0xff0000,
 emissiveIntensity:4
});

/* =====================================================
   WORLD
   ===================================================== */

function makeWorld(){

 scene=new THREE.Scene();

 scene.background=new THREE.Color(0x8fa5b4);

 scene.fog=new THREE.Fog(
  0x8fa5b4,
  45,
  180
 );

 camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .05,
  500
 );

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
 );

 renderer.shadowMap.enabled=true;

 document.body.appendChild(renderer.domElement);

 const hemi=new THREE.HemisphereLight(
  0xddeeff,
  0x303030,
  2
 );

 scene.add(hemi);

 const sun=new THREE.DirectionalLight(
  0xffffff,
  3
 );

 sun.position.set(
  -40,
  70,
  30
 );

 sun.castShadow=true;

 sun.shadow.mapSize.width=1024;
 sun.shadow.mapSize.height=1024;

 scene.add(sun);

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshStandardMaterial({
   color:0x586058,
   roughness:1
  })
 );

 ground.rotation.x=-Math.PI/2;
 ground.receiveShadow=true;

 scene.add(ground);

 const road=new THREE.Mesh(
  new THREE.PlaneGeometry(18,500),
  new THREE.MeshStandardMaterial({
   color:0x292b2d,
   roughness:1
  })
 );

 road.rotation.x=-Math.PI/2;
 road.position.y=.02;

 scene.add(road);

 /* 중앙 차선 */

 for(let z=-240;z<250;z+=8){

  const line=new THREE.Mesh(
   new THREE.BoxGeometry(.15,.025,4),
   new THREE.MeshBasicMaterial({
    color:0xffffff
   })
  );

  line.position.set(
   0,
   .04,
   z
  );

  scene.add(line);
 }

 /* 도시 */

 for(let i=0;i<65;i++){

  const h=4+Math.random()*14;
  const w=3+Math.random()*7;

  const b=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,w),
   new THREE.MeshStandardMaterial({
    color:0x555b60,
    roughness:.9
   })
  );

  const side=
   Math.random()<.5?-1:1;

  b.position.set(
   side*(15+Math.random()*25),
   h/2,
   -230+Math.random()*460
  );

  scene.add(b);
 }
}

/* =====================================================
   DENSE CAR BODY
   ===================================================== */

function makeCar(){

 car=new THREE.Group();

 car.position.y=.48;

 scene.add(car);

 const vertices=[];
 const indices=[];

 /*
   20개 단면
   각 단면 10개 정점
   총 200개의 차체 정점
   */

 const sections=[
  [-4.80,1.18,1.25],
  [-4.65,1.24,1.48],
  [-4.40,1.31,1.68],
  [-4.05,1.38,1.88],
  [-3.60,1.44,2.03],
  [-3.10,1.49,2.12],
  [-2.50,1.54,2.18],
  [-1.80,1.57,2.22],
  [-1.00,1.59,2.24],
  [0,1.60,2.25],
  [.90,1.59,2.24],
  [1.70,1.57,2.22],
  [2.50,1.54,2.17],
  [3.15,1.49,2.10],
  [3.65,1.43,2.00],
  [4.05,1.37,1.87],
  [4.40,1.30,1.70],
  [4.65,1.24,1.48],
  [4.80,1.18,1.25]
 ];

 for(let i=0;i<sections.length;i++){

  const z=sections[i][0];
  const h=sections[i][1];
  const w=sections[i][2];

  vertices.push(
   -w,.42,z,
    w,.42,z,

   -w*1.02,h*.72,z,
    w*1.02,h*.72,z,

   -w*.98,h*.91,z,
    w*.98,h*.91,z,

   -w*.82,h,z,
    w*.82,h,z,

   -w*.58,h*1.06,z,
    w*.58,h*1.06,z
  );
 }

 const N=10;

 for(let i=0;i<sections.length-1;i++){

  for(let j=0;j<N-1;j++){

   const a=i*N+j;
   const b=i*N+j+1;
   const c=(i+1)*N+j;
   const d=(i+1)*N+j+1;

   indices.push(
    a,c,b,
    b,c,d
   );
  }
 }

 const geo=new THREE.BufferGeometry();

 geo.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
   vertices,
   3
  )
 );

 geo.setIndex(indices);

 geo.computeVertexNormals();

 const mesh=new THREE.Mesh(
  geo,
  bodyMat
 );

 mesh.castShadow=true;
 mesh.receiveShadow=true;

 car.add(mesh);

 /* 바닥 차체 */

 const lower=new THREE.Mesh(
  new THREE.BoxGeometry(
   4.4,
   .48,
   9.3,
   5,
   3,
   8
  ),
  bodyDark
 );

 lower.position.y=.48;

 car.add(lower);

 /* 후드 */

 const hood=new THREE.Mesh(
  new THREE.BoxGeometry(
   3.9,
   .25,
   3.0,
   8,
   3,
   8
  ),
  bodyMat
 );

 hood.position.set(
  0,
  1.03,
  -2.85
 );

 hood.rotation.x=-.025;

 car.add(hood);

 /* 루프 */

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(
   3.55,
   .25,
   4.45,
   8,
   3,
   8
  ),
  bodyMat
 );

 roof.position.set(
  0,
  2.0,
  .35
 );

 car.add(roof);

 makeCabin();
 makeDoors();
 makeLights();
 makeGrille();
 makeBumpers();
 makeMirrors();
 makeWheels();
 makeInterior();
}

/* =====================================================
   CABIN
   ===================================================== */

function makeCabin(){

 const front=new THREE.Mesh(
  new THREE.BoxGeometry(
   3.15,
   1.18,
   .08,
   8,
   4,
   2
  ),
  glassMat
 );

 front.position.set(
  0,
  1.82,
  -1.45
 );

 front.rotation.x=-.25;

 car.add(front);

 const rear=new THREE.Mesh(
  new THREE.BoxGeometry(
   3.15,
   1.08,
   .08,
   8,
   4,
   2
  ),
  glassMat
 );

 rear.position.set(
  0,
  1.82,
  1.72
 );

 rear.rotation.x=.18;

 car.add(rear);

 for(const side of[-1,1]){

  const window=new THREE.Mesh(
   new THREE.BoxGeometry(
    .07,
    1.08,
    4.0,
    3,
    5,
    10
   ),
   glassMat
  );

  window.position.set(
   side*1.78,
   1.82,
   .15
  );

  car.add(window);

  for(const z of[-1.4,0,1.65]){

   const pillar=new THREE.Mesh(
    new THREE.BoxGeometry(
     .12,
     1.35,
     .13
    ),
    blackMat
   );

   pillar.position.set(
    side*1.82,
    1.9,
    z
   );

   car.add(pillar);
  }
 }
}

/* =====================================================
   DOORS
   ===================================================== */

function makeDoors(){

 for(const side of[-1,1]){

  for(let i=0;i<4;i++){

   const z=-2.25+i*1.5;

   const line=new THREE.Mesh(
    new THREE.BoxGeometry(
     .025,
     .035,
     1.25
    ),
    chromeMat
   );

   line.position.set(
    side*2.13,
    1.32,
    z
   );

   car.add(line);

   const handle=new THREE.Mesh(
    new THREE.BoxGeometry(
     .07,
     .065,
     .42
    ),
    chromeMat
   );

   handle.position.set(
    side*2.16,
    1.53,
    z
   );

   car.add(handle);
  }
 }
}

/* =====================================================
   LIGHTS
   ===================================================== */

function makeLights(){

 for(const side of[-1,1]){

  const head=new THREE.Mesh(
   new THREE.BoxGeometry(
    .9,
    .22,
    .13
   ),
   lightMat
  );

  head.position.set(
   side*1.35,
   1.16,
   -4.72
  );

  car.add(head);

  const point=new THREE.PointLight(
   0xffffff,
   3,
   20
  );

  point.position.copy(head.position);

  car.add(point);

  const tail=new THREE.Mesh(
   new THREE.BoxGeometry(
    .9,
    .2,
    .13
   ),
   redMat
  );

  tail.position.set(
   side*1.35,
   1.12,
   4.72
  );

  car.add(tail);
 }
}

/* =====================================================
   GRILLE
   ===================================================== */

function makeGrille(){

 const grille=new THREE.Mesh(
  new THREE.BoxGeometry(
   2.2,
   .43,
   .12,
   8,
   4,
   2
  ),
  blackMat
 );

 grille.position.set(
  0,
  .91,
  -4.77
 );

 car.add(grille);

 for(let i=-6;i<=6;i++){

  const bar=new THREE.Mesh(
   new THREE.BoxGeometry(
    .035,
    .34,
    .04
   ),
   chromeMat
  );

  bar.position.set(
   i*.17,
   .91,
   -4.84
  );

  car.add(bar);
 }
}

/* =====================================================
   BUMPERS
   ===================================================== */

function makeBumpers(){

 const front=new THREE.Mesh(
  new THREE.BoxGeometry(
   4.3,
   .43,
   .42,
   8,
   3,
   5
  ),
  bodyDark
 );

 front.position.set(
  0,
  .65,
  -4.72
 );

 car.add(front);

 const rear=front.clone();

 rear.position.z=4.72;

 car.add(rear);

 const splitter=new THREE.Mesh(
  new THREE.BoxGeometry(
   3.55,
   .12,
   .32
  ),
  blackMat
 );

 splitter.position.set(
  0,
  .47,
  -4.9
 );

 car.add(splitter);
}

/* =====================================================
   MIRRORS
   ===================================================== */

function makeMirrors(){

 for(const side of[-1,1]){

  const arm=new THREE.Mesh(
   new THREE.BoxGeometry(
    .12,
    .12,
    .45
   ),
   blackMat
  );

  arm.position.set(
   side*2.12,
   1.65,
   -.95
  );

  car.add(arm);

  const mirror=new THREE.Mesh(
   new THREE.SphereGeometry(
    .25,
    12,
    8
   ),
   bodyDark
  );

  mirror.scale.set(
   .75,
   .7,
   1.25
  );

  mirror.position.set(
   side*2.35,
   1.68,
   -.95
  );

  car.add(mirror);
 }
}

/* =====================================================
   WHEELS
   ===================================================== */

function makeWheels(){

 const positions=[
  [-1.75,.58,-2.95],
  [ 1.75,.58,-2.95],
  [-1.75,.58, 2.95],
  [ 1.75,.58, 2.95]
 ];

 positions.forEach((p,index)=>{

  const group=new THREE.Group();

  group.position.set(
   p[0],
   p[1],
   p[2]
  );

  const tire=new THREE.Mesh(
   new THREE.CylinderGeometry(
    .74,
    .74,
    .38,
    32
   ),
   tireMat
  );

  tire.rotation.z=Math.PI/2;

  group.add(tire);

  const rim=new THREE.Mesh(
   new THREE.CylinderGeometry(
    .46,
    .46,
    .40,
    24
   ),
   chromeMat
  );

  rim.rotation.z=Math.PI/2;

  group.add(rim);

  const hub=new THREE.Mesh(
   new THREE.CylinderGeometry(
    .13,
    .13,
    .43,
    16
   ),
   blackMat
  );

  hub.rotation.z=Math.PI/2;

  group.add(hub);

  for(let s=0;s<10;s++){

   const spoke=new THREE.Mesh(
    new THREE.BoxGeometry(
     .06,
     .42,
     .075
    ),
    chromeMat
   );

   spoke.rotation.z=
    s*Math.PI/5;

   spoke.rotation.y=
    Math.PI/2;

   group.add(spoke);
  }

  car.add(group);

  wheels.push(group);
 });
}

/* =====================================================
   INTERIOR
   ===================================================== */

function makeInterior(){

 const dash=new THREE.Mesh(
  new THREE.BoxGeometry(
   3.2,
   .5,
   1.1
  ),
  blackMat
 );

 dash.position.set(
  0,
  1.28,
  -1.7
 );

 car.add(dash);

 const wheel=new THREE.Mesh(
  new THREE.TorusGeometry(
   .38,
   .065,
   12,
   24
  ),
  blackMat
 );

 wheel.position.set(
  -.72,
  1.5,
  -1.78
 );

 wheel.rotation.y=Math.PI/2;

 car.add(wheel);

 const display=new THREE.Mesh(
  new THREE.BoxGeometry(
   1.2,
   .45,
   .05
  ),
  new THREE.MeshStandardMaterial({
   color:0x16384c,
   emissive:0x087fa8,
   emissiveIntensity:2
  })
 );

 display.position.set(
  .25,
  1.52,
  -1.77
 );

 car.add(display);
}

/* =====================================================
   TRAFFIC
   ===================================================== */

function makeTraffic(){

 for(let i=0;i<12;i++){

  const t=new THREE.Group();

  const color=new THREE.Color();

  color.setHSL(
   Math.random(),
   .55,
   .38
  );

  const mat=new THREE.MeshStandardMaterial({
   color:color,
   metalness:.65,
   roughness:.3
  });

  const b=new THREE.Mesh(
   new THREE.BoxGeometry(
    2.1,
    .7,
    4.3,
    4,
    3,
    6
   ),
   mat
  );

  b.position.y=.65;

  t.add(b);

  for(const side of[-1,1]){

   for(const z of[-1.45,1.45]){

    const w=new THREE.Mesh(
     new THREE.CylinderGeometry(
      .38,
      .38,
      .25,
      16
     ),
     tireMat
    );

    w.rotation.z=Math.PI/2;

    w.position.set(
     side*1.06,
     .42,
     z
    );

    t.add(w);
   }
  }

  t.position.set(
   Math.random()<.5?-4.5:4.5,
   0,
   -50-Math.random()*180
  );

  scene.add(t);

  traffic.push(t);
 }
}

/* =====================================================
   PHYSICS
   ===================================================== */

function physics(dt){

 if(paused)return;

 if(throttle){
  speed+=13*dt;
 }else{
  speed-=3*dt;
 }

 if(braking){
  speed-=22*dt;
 }

 speed=Math.max(
  0,
  Math.min(55,speed)
 );

 const turn=
  steering*(speed/55)*1.8;

 car.rotation.y-=turn*dt;

 const forward=new THREE.Vector3(
  0,
  0,
  -1
 );

 forward.applyQuaternion(
  car.quaternion
 );

 car.position.addScaledVector(
  forward,
  speed*dt
 );

 car.position.x=
  THREE.MathUtils.clamp(
   car.position.x,
   -6,
   6
  );

 for(let i=0;i<4;i++){

  wheels[i].children[0].rotation.x-=
   speed*dt*2.2;
 }

 for(const t of traffic){

  t.position.z+=speed*dt*.65;

  if(t.position.z>25){

   t.position.z=
    -180-Math.random()*120;

   t.position.x=
    Math.random()<.5?-4.5:4.5;
  }

  const dx=Math.abs(
   t.position.x-car.position.x
  );

  const dz=Math.abs(
   t.position.z-car.position.z
  );

  if(dx<2.5 && dz<4){

   damage+=35*dt;

   damage=Math.min(
    100,
    damage
   );

   speed*=.94;

   car.rotation.y+=
    (Math.random()-.5)*.12;
  }
 }

 updateCamera();
 updateHUD();
}

/* =====================================================
   CAMERA
   ===================================================== */

function updateCamera(){

 const target=car.position.clone();

 if(cameraMode===0){

  const off=new THREE.Vector3(
   0,
   3.0,
   8.5
  );

  off.applyQuaternion(
   car.quaternion
  );

  camera.position.lerp(
   target.clone().add(off),
   .1
  );

  const look=new THREE.Vector3(
   0,
   1,
   -4
  );

  look.applyQuaternion(
   car.quaternion
  );

  camera.lookAt(
   target.clone().add(look)
  );

 }else if(cameraMode===1){

  const off=new THREE.Vector3(
   4.8,
   2.4,
   5.8
  );

  off.applyQuaternion(
   car.quaternion
  );

  camera.position.lerp(
   target.clone().add(off),
   .1
  );

  camera.lookAt(target);

 }else{

  const off=new THREE.Vector3(
   -.72,
   1.55,
   -.55
  );

  off.applyQuaternion(
   car.quaternion
  );

  camera.position.lerp(
   target.clone().add(off),
   .15
  );

  const look=new THREE.Vector3(
   -.72,
   1.5,
   -8
  );

  look.applyQuaternion(
   car.quaternion
  );

  camera.lookAt(
   target.clone().add(look)
  );
 }
}

/* =====================================================
   HUD
   ===================================================== */

function updateHUD(){

 const kmh=Math.round(
  speed*3.6
 );

 document.getElementById("speed")
  .firstChild.nodeValue=
  kmh+" KM/H ";

 document.getElementById("rpm")
  .textContent=
  "RPM "+Math.round(
   800+speed*105
  );

 document.getElementById("damage")
  .style.width=
  damage+"%";
}

/* =====================================================
   TOUCH STEERING
   ===================================================== */

const wheelEl=
 document.getElementById("wheel");

const knob=
 document.getElementById("knob");

let wheelPointer=null;

function setSteering(x){

 const r=
  wheelEl.getBoundingClientRect();

 const center=
  r.left+r.width/2;

 const max=
  r.width*.37;

 let dx=x-center;

 dx=Math.max(
  -max,
  Math.min(max,dx)
 );

 steering=
  dx/max;

 knob.style.transform=
  "translate("+dx+"px,0)";
}

wheelEl.addEventListener(
 "pointerdown",
 e=>{

  e.preventDefault();

  wheelPointer=e.pointerId;

  wheelEl.setPointerCapture(
   e.pointerId
  );

  setSteering(e.clientX);
 }
);

wheelEl.addEventListener(
 "pointermove",
 e=>{

  if(e.pointerId===
     wheelPointer){

   setSteering(
    e.clientX
   );
  }
 }
);

function releaseWheel(){

 wheelPointer=null;
 steering=0;
 knob.style.transform=
  "translate(0,0)";
}

wheelEl.addEventListener(
 "pointerup",
 releaseWheel
);

wheelEl.addEventListener(
 "pointercancel",
 releaseWheel
);

/* =====================================================
   PEDALS
   ===================================================== */

function setupPedal(id,type){

 const el=
  document.getElementById(id);

 el.addEventListener(
  "pointerdown",
  e=>{

   e.preventDefault();

   if(type==="gas"){
    throttle=1;
   }else{
    braking=1;
   }

   el.setPointerCapture(
    e.pointerId
   );
  }
 );

 const off=()=>{

  if(type==="gas"){
   throttle=0;
  }else{
   braking=0;
  }
 };

 el.addEventListener(
  "pointerup",
  off
 );

 el.addEventListener(
  "pointercancel",
  off
 );
}

setupPedal("gas","gas");
setupPedal("brake","brake");

/* =====================================================
   CAMERA BUTTON
   ===================================================== */

document.getElementById("cam").onclick=()=>{

 cameraMode++;

 if(cameraMode>2){
  cameraMode=0;
 }

 const names=[
  "THIRD PERSON",
  "SPORT CAMERA",
  "COCKPIT"
 ];

 document.getElementById(
  "camName"
 ).textContent=
  names[cameraMode];
};

/* =====================================================
   PAUSE
   ===================================================== */

document.getElementById("pause").onclick=()=>{

 paused=true;

 document.getElementById(
  "pauseScreen"
 ).style.display="flex";
};

document.getElementById("resume").onclick=()=>{

 paused=false;

 document.getElementById(
  "pauseScreen"
 ).style.display="flex";

 document.getElementById(
  "pauseScreen"
 ).style.display="none";
};

/* =====================================================
   GAME START
   ===================================================== */

function startGame(){

 if(started)return;

 started=true;

 document.getElementById(
  "menu"
 ).style.display="none";

 document.getElementById(
  "gameUI"
 ).style.display="block";

 document.getElementById(
  "controls"
 ).style.display="block";

 /*
   모바일 브라우저에서 전체화면을 요청.
   실패해도 게임 시작에는 영향 없음.
 */

 if(document.documentElement.requestFullscreen){

  document.documentElement
   .requestFullscreen()
   .catch(()=>{});
 }
}

/* =====================================================
   ENGINE LOAD
   ===================================================== */

function engineReady(){

 if(typeof THREE==="undefined"){
  return false;
 }

 try{

  makeWorld();
  makeCar();
  makeTraffic();

  document.getElementById(
   "start"
  ).disabled=false;

  document.getElementById(
   "start"
  ).textContent=
   "▶ DRIVE START";

  document.getElementById(
   "loading"
  ).textContent=
   "READY";

  return true;

 }catch(e){

  console.error(e);

  document.getElementById(
   "loading"
  ).textContent=
   "3D 초기화 오류";

  return false;
 }
}

/* =====================================================
   START BUTTON
   ===================================================== */

document.getElementById(
 "start"
).addEventListener(
 "click",
 startGame
);

/* =====================================================
   FALLBACK CDN
   ===================================================== */

const threeScript=
 document.getElementById(
  "threeScript"
 );

threeScript.addEventListener(
 "load",
 ()=>{

  setTimeout(
   engineReady,
   50
  );
 }
);

threeScript.addEventListener(
 "error",
 ()=>{

  /*
    첫 번째 CDN 실패 시
    unpkg로 자동 재시도
  */

  const fallback=
   document.createElement(
    "script"
   );

  fallback.src=
   "https://unpkg.com/three@0.180.0/build/three.min.js";

  fallback.onload=()=>{
   setTimeout(
    engineReady,
    50
   );
  };

  fallback.onerror=()=>{

   document.getElementById(
    "loading"
   ).textContent=
   "인터넷 연결을 확인하세요";
  };

  document.head.appendChild(
   fallback
  );
});

/* =====================================================
   ANIMATION
   ===================================================== */

function animate(){

 requestAnimationFrame(
  animate
 );

 const dt=
  Math.min(
   clock.getDelta(),
   .05
  );

 if(started){
  physics(dt);
 }

 renderer.render(
  scene,
  camera
 );
}

/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
 "resize",
 ()=>{

  if(!camera||!renderer)return;

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

/* =====================================================
   BOOT
   ===================================================== */

animate();
</script>
