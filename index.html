<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.T.B. STUDIO</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial, "Noto Sans KR", sans-serif;
    overflow-x:hidden;
}

/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:opacity 1.2s ease;
}

.intro-content{
    position:relative;
    width:100%;
    height:100%;
}

/* D.T.B. */
.intro-dtb{
    position:absolute;
    left:calc(50% - 150px);
    top:43%;
    font-size:clamp(52px,8vw,88px);
    font-weight:1000;
    letter-spacing:12px;

    opacity:0;
    transform:translateX(-120px);

    animation:
        dtbSlide 1.4s cubic-bezier(.16,1,.3,1) .2s forwards;
}

/* _____ */
.intro-line{
    position:absolute;
    left:50%;
    top:52%;
    width:0;
    height:2px;
    background:#fff;

    transform:translateX(-50%);

    animation:
        lineSlide 1.3s cubic-bezier(.16,1,.3,1) 1.1s forwards;
}

/* STUDIO */
.intro-studio{
    position:absolute;
    left:calc(50% - 10px);
    top:55%;
    font-size:clamp(22px,4vw,38px);
    font-weight:700;
    letter-spacing:14px;

    opacity:0;
    transform:translate(100px,20px);

    animation:
        studioSlide 1.5s cubic-bezier(.16,1,.3,1) 1.6s forwards;
}

@keyframes dtbSlide{
    0%{
        opacity:0;
        transform:translateX(-120px);
        filter:blur(15px);
    }

    100%{
        opacity:1;
        transform:translateX(0);
        filter:blur(0);
    }
}

@keyframes lineSlide{
    0%{
        width:0;
        opacity:0;
    }

    100%{
        width:min(420px,70vw);
        opacity:1;
    }
}

@keyframes studioSlide{
    0%{
        opacity:0;
        transform:translate(100px,20px);
        filter:blur(12px);
    }

    100%{
        opacity:1;
        transform:translate(0,0);
        filter:blur(0);
    }
}

/* =========================
   MAIN
========================= */

#site{
    opacity:0;
    transition:opacity 1.5s ease;
}

#site.show{
    opacity:1;
}

main{
    max-width:900px;
    margin:auto;
    padding:80px 24px 150px;
}

/* =========================
   HEADER
========================= */

.small-brand{
    font-size:13px;
    letter-spacing:2px;
    color:#777;
    margin-bottom:55px;

    opacity:0;
    transform:translateY(25px);
    transition:1s ease;
}

.small-brand.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   TITLE
========================= */

.title-section{
    min-height:75vh;

    display:flex;
    flex-direction:column;
    justify-content:center;

    padding-bottom:100px;
}

.title{
    font-size:clamp(42px,8vw,78px);
    line-height:1.05;
    font-weight:1000;
    letter-spacing:-3px;

    opacity:0;
    transform:translateY(45px);
    filter:blur(10px);

    transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.16,1,.3,1),
        filter 1s ease;
}

.title.show{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
}

.title-sub{
    margin-top:22px;
    color:#777;
    font-size:15px;
    line-height:1.8;

    opacity:0;
    transform:translateY(30px);

    transition:
        opacity 1s ease .15s,
        transform 1s ease .15s;
}

.title-sub.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   INFO BOX
========================= */

.info-section{
    margin-bottom:180px;
}

.info-box{
    background:#111;
    border:1px solid #222;
    border-radius:24px;
    padding:35px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.4);

    opacity:0;
    transform:translateY(70px);
    transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.16,1,.3,1);
}

.info-box.show{
    opacity:1;
    transform:translateY(0);
}

.info-label{
    color:#777;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:15px;
}

.info-title{
    font-size:28px;
    font-weight:900;
    margin-bottom:25px;
}

.date{
    font-size:clamp(20px,4vw,30px);
    font-weight:800;
    line-height:1.5;
}

.date span{
    color:#777;
}

.status{
    display:inline-block;
    margin-top:25px;
    padding:9px 14px;
    border-radius:20px;
    background:#1a1a1a;
    color:#aaa;
    font-size:13px;
}

/* =========================
   FUTURE FEATURES
========================= */

.future-section{
    margin-bottom:120px;
}

.future-box{
    background:#0d0d0d;
    border:1px solid #202020;
    border-radius:24px;
    padding:35px;

    opacity:0;
    transform:translateY(80px);

    transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.16,1,.3,1);
}

.future-box.show{
    opacity:1;
    transform:translateY(0);
}

.future-title{
    font-size:27px;
    font-weight:900;
    margin-bottom:30px;
}

.feature{
    display:flex;
    align-items:center;
    gap:15px;

    padding:18px 0;
    border-bottom:1px solid #1d1d1d;

    color:#bbb;
    font-size:16px;

    opacity:0;
    transform:translateX(-30px);
    transition:
        opacity .7s ease,
        transform .7s cubic-bezier(.16,1,.3,1);
}

.future-box.show .feature{
    opacity:1;
    transform:translateX(0);
}

.future-box.show .feature:nth-child(2){
    transition-delay:.15s;
}

.future-box.show .feature:nth-child(3){
    transition-delay:.3s;
}

.future-box.show .feature:nth-child(4){
    transition-delay:.45s;
}

.future-box.show .feature:nth-child(5){
    transition-delay:.6s;
}

.feature:last-child{
    border-bottom:0;
}

.dot{
    width:7px;
    height:7px;
    background:#fff;
    border-radius:50%;
    flex-shrink:0;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    color:#444;
    font-size:12px;
    letter-spacing:2px;

    opacity:0;
    transform:translateY(25px);
    transition:1s ease;
}

.footer.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .intro-dtb{
        left:calc(50% - 115px);
        letter-spacing:8px;
    }

    .intro-studio{
        left:calc(50% - 5px);
        letter-spacing:9px;
    }

    main{
        padding:55px 18px 100px;
    }

    .small-brand{
        margin-bottom:35px;
    }

    .title-section{
        min-height:70vh;
    }

    .info-box,
    .future-box{
        padding:25px;
        border-radius:19px;
    }

    .info-title,
    .future-title{
        font-size:23px;
    }
}
</style>
</head>

<body>

<!-- =========================
     INTRO
========================= -->

<div id="intro">
    <div class="intro-content">

        <div class="intro-dtb">
            D.T.B.
        </div>

        <div class="intro-line"></div>

        <div class="intro-studio">
            STUDIO
        </div>

    </div>
</div>


<!-- =========================
     SITE
========================= -->

<div id="site">

<main>

    <div id="brand" class="small-brand">
        D.T.B. (구. 똥꼬브라더스)
    </div>


    <!-- 제목 -->

    <section class="title-section">

        <h1 id="title" class="title">
            홈페이지<br>
            서버 점검 안내
        </h1>

        <p id="titleSub" class="title-sub">
            현재 D.T.B. MUSIC 홈페이지는<br>
            서버 점검 및 업데이트를 진행하고 있습니다.
        </p>

    </section>


    <!-- 점검 시간 -->

    <section class="info-section">

        <div id="infoBox" class="info-box">

            <div class="info-label">
                SERVER MAINTENANCE
            </div>

            <div class="info-title">
                서버 점검 시간
            </div>

            <div class="date">
                2026.8.19 오후 3:30
                <span>~</span><br>
                2026.8.20 오전 3:30
            </div>

            <div class="status">
                ● 현재 서버 점검 중
            </div>

        </div>

    </section>


    <!-- 추가 예정 -->

    <section class="future-section">

        <div id="futureBox" class="future-box">

            <div class="future-title">
                서버 오픈 후 추가될 항목
            </div>

            <div class="feature">
                <div class="dot"></div>
                <div>미니게임</div>
            </div>

            <div class="feature">
                <div class="dot"></div>
                <div>노래 재생</div>
            </div>

            <div class="feature">
                <div class="dot"></div>
                <div>노래 박자 맞추기 게임</div>
            </div>

            <div class="feature">
                <div class="dot"></div>
                <div>더 많은 미니게임</div>
            </div>

        </div>

    </section>


    <div id="footer" class="footer">
        D.T.B. STUDIO · 2026
    </div>

</main>

</div>


<script>

/* =========================
   INTRO 종료
========================= */

setTimeout(() => {

    const intro = document.getElementById("intro");
    const site = document.getElementById("site");

    intro.style.opacity = "0";

    setTimeout(() => {

        intro.style.display = "none";
        site.classList.add("show");

        document.getElementById("brand").classList.add("show");
        document.getElementById("title").classList.add("show");

        setTimeout(() => {
            document.getElementById("titleSub").classList.add("show");
        },300);

    },1200);

},4300);


/* =========================
   스크롤 페이드인
========================= */

const observer = new IntersectionObserver(
    entries => {

        entries.forEach(entry => {

            if(entry.isIntersecting){

                entry.target.classList.add("show");

                observer.unobserve(entry.target);

            }

        });

    },
    {
        threshold:.15
    }
);


document.querySelectorAll(
    ".info-box, .future-box, .footer"
).forEach(element => {

    observer.observe(element);

});

</script>

</body>
</html>
