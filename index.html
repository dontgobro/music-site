<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>D.T.B. DRIVE</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#72b4e8;
  font-family:Arial,sans-serif;
}
#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* START */
#start{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:linear-gradient(180deg,#62a9e4,#b9ddf6);
}
.logo{
  color:white;
  font-size:clamp(35px,8vw,70px);
  font-weight:900;
  letter-spacing:5px;
  text-shadow:0 5px 18px #244c6c;
}
.studio{
  color:white;
  opacity:.85;
  letter-spacing:6px;
  margin-top:8px;
  margin-bottom:38px;
}
#startBtn{
  appearance:none;
  border:0;
  outline:0;
  padding:18px 70px;
  border-radius:18px;
  background:#111;
  color:white;
  font-size:22px;
  font-weight:900;
  box-shadow:0 10px 30px #0005;
  touch-action:manipulation;
}
#startBtn:active{
  transform:scale(.96);
}

/* HUD */
#hud{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:none;
}
#speed{
  position:absolute;
  left:18px;
  top:15px;
  color:white;
  font-size:26px;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}
#damage{
  position:absolute;
  left:19px;
  top:50px;
  color:white;
  font-size:14px;
  text-shadow:0 2px 5px #000;
}
#cam{
  position:absolute;
  right:16px;
  top:15px;
  padding:11px 15px;
  border:1px solid #fff5;
  border-radius:12px;
  background:#111b;
  color:white;
  font-weight:bold;
  pointer-events:auto;
  touch-action:manipulation;
}

/* steering wheel */
#wheel{
  position:absolute;
  left:22px;
  bottom:22px;
  width:145px;
  height:145px;
  border:9px solid #ffffffbb;
  border-radius:50%;
  background:#1118;
  pointer-events:auto;
  touch-action:none;
  transition:transform .08s linear;
}
#wheel::before{
  content:"";
  position:absolute;
  inset:20px;
  border:6px solid #ffffffdd;
  border-radius:50%;
}
.spoke{
  position:absolute;
  width:7px;
  height:58px;
  left:60px;
  top:38px;
  background:#fff;
  border-radius:5px;
  transform-origin:50% 50%;
}
.s1{transform:rotate(0deg)}
.s2{transform:rotate(120deg)}
.s3{transform:rotate(240deg)}
#hub{
  position:absolute;
  width:20px;
  height:20px;
  left:54px;
  top:54px;
  border-radius:50%;
  background:#ddd;
}

/* pedals */
#pedals{
  position:absolute;
  right:22px;
  bottom:22px;
  display:flex;
  gap:12px;
  pointer-events:auto;
}
.pedal{
  width:100px;
  height:70px;
  border:1px solid #fff5;
  border-radius:17px;
  color:white;
  font-weight:900;
  font-size:17px;
  touch-action:none;
}
#gas{
  background:#19753dcc;
}
#brake{
  background:#852828cc;
}

@media(max-width:700px){
  #wheel{
    width:120px;
    height:120px;
    border-width:7px;
  }
  #wheel::before{
    inset:17px;
    border-width:5px;
  }
  .spoke{
    left:50px;
    top:32px;
    height:48px;
  }
  #hub{
    left:45px;
    top:45px;
    width:18px;
    height:18px;
  }
  .pedal{
    width:82px;
    height:62px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="start">
  <div class="logo">D.T.B. DRIVE</div>
  <div class="studio">CITY DRIVING // STUDIO</div>
  <button id="startBtn">START</button>
</div>

<div id="hud">
  <div id="speed">0 KM/H</div>
  <div id="damage">DAMAGE 0%</div>
  <button id="cam">CAM 1</button>

  <div id="wheel">
    <div class="spoke s1"></div>
    <div class="spoke s2"></div>
    <div class="spoke s3"></div>
    <div id="hub"></div>
  </div>

  <div id="pedals">
    <button class="pedal" id="brake">BRAKE</button>
    <button class="pedal" id="gas">GAS</button>
  </div>
</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =====================================================
   D.T.B. DRIVE
   THREE.JS EDITION
===================================================== */

let gameStarted=false;

/* START 버튼을 가장 먼저 연결 */
const startScreen=document.getElementById("start");
const startButton=document.getElementById("startBtn");
const hud=document.getElementById("hud");

function startGame(e){
  if(e) e.preventDefault();

  gameStarted=true;
  startScreen.style.display="none";
  hud.style.display="block";

  if(audioContext){
    try{audioContext.resume();}catch(e){}
  }
}

startButton.addEventListener("pointerdown",startGame,{passive:false});
startButton.addEventListener("click",startGame);

/* =====================================================
   THREE
===================================================== */

const canvas=document.getElementById("game");

const renderer=new THREE.WebGLRenderer({
  canvas:canvas,
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x76b8ea);
scene.fog=new THREE.Fog(0x76b8ea,80,330);

const camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  0.1,
  500
);

/* =====================================================
   LIGHT
===================================================== */

const hemi=new THREE.HemisphereLight(
  0xcfeaff,
  0x4c603e,
  2.0
);
scene.add(hemi);

const sun=new THREE.DirectionalLight(
  0xffffff,
  3.0
);
sun.position.set(-80,130,70);
sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-120;
sun.shadow.camera.right=120;
sun.shadow.camera.top=120;
sun.shadow.camera.bottom=-120;

scene.add(sun);

/* =====================================================
   MATERIAL
===================================================== */

function mat(color,rough=.6,metal=0){
  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:rough,
    metalness:metal
  });
}

const MAT={
  road:mat(0x292b2e),
  sidewalk:mat(0x777975),
  curb:mat(0xb2b2ad),
  grass:mat(0x397a31),
  white:mat(0xf0f0e9),
  tire:mat(0x111214,.9),
  rim:mat(0x9fa5aa,.25,.8),
  glass:mat(0x102b3d,.18,.55),
  chrome:mat(0xc7cbd0,.18,.9),
  black:mat(0x101113),
  yellow:mat(0xffe36a,.3,.1),
  red:mat(0xd21e20,.35,.1)
};

/* =====================================================
   WORLD
===================================================== */

function cube(w,h,d,material){
  const g=new THREE.BoxGeometry(w,h,d);
  const m=new THREE.Mesh(g,material);
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function addBox(x,y,z,w,h,d,material){
  const m=cube(w,h,d,material);
  m.position.set(x,y,z);
  scene.add(m);
  return m;
}

/* ground */
addBox(0,-.25,0,90,.5,700,MAT.grass);

/* road */
addBox(0,0,0,13.5,.16,700,MAT.road);

/* sidewalks */
addBox(-8.1,.08,0,2.0,.22,700,MAT.sidewalk);
addBox(8.1,.08,0,2.0,.22,700,MAT.sidewalk);

/* curbs */
addBox(-7.0,.22,0,.18,.30,700,MAT.curb);
addBox(7.0,.22,0,.18,.30,700,MAT.curb);

/* lane lines */
for(let z=-340;z<340;z+=10){
  addBox(0,.11,z,.11,.025,4.2,MAT.white);
}

/* side road lines */
for(let z=-340;z<340;z+=5){
  addBox(-5.8,.11,z,.055,.018,2.0,MAT.white);
  addBox(5.8,.11,z,.055,.018,2.0,MAT.white);
}

/* =====================================================
   BUILDINGS
===================================================== */

const buildingMats=[
  mat(0x68717a),
  mat(0x8b8c87),
  mat(0x5e6972),
  mat(0xaaa69d),
  mat(0x59616c)
];

function apartment(x,z,w,h,d,mi){

  const body=cube(w,h,d,buildingMats[mi%buildingMats.length]);
  body.position.set(x,h/2,z);
  scene.add(body);

  /* windows */
  const floors=Math.floor(h/3);

  for(let f=0;f<floors;f++){

    const y=1.35+f*3;

    for(let q=-1;q<=1;q++){

      const win=cube(
        w*.20,
        .75,
        .045,
        MAT.glass
      );

      win.position.set(
        x+q*w*.28,
        y,
        z-d/2-.035
      );

      scene.add(win);
    }

    /* balcony every 2 floors */
    if(f%2===0){
      const bal=cube(
        w*.38,
        .08,
        1.1,
        MAT.curb
      );

      bal.position.set(
        x+w*.30,
        y-.62,
        z-d/2-.48
      );

      scene.add(bal);
    }
  }

  /* roof */
  const roof=cube(
    w+.25,
    .18,
    d+.25,
    MAT.black
  );

  roof.position.set(x,h+.09,z);
  scene.add(roof);
}

/* many buildings */
const buildings=[
 [-15,20,8,21,9],
 [15,34,8,28,9],
 [-15,52,7,17,8],
 [15,68,9,24,10],
 [-15,88,8,30,9],
 [15,105,7,20,8],
 [-15,125,9,25,10],
 [15,143,8,30,9],
 [-15,164,8,19,9],
 [15,181,9,27,10],
 [-15,202,8,22,9],
 [15,222,8,31,9],
 [-15,245,9,27,10],
 [15,267,8,20,9],
 [-15,290,8,30,9],

 [-15,-25,8,25,9],
 [15,-43,8,18,9],
 [-15,-63,9,28,10],
 [15,-84,8,23,9],
 [-15,-105,8,30,9],
 [15,-126,9,20,10],
 [-15,-148,8,26,9],
 [15,-170,8,31,9],
 [-15,-192,9,22,10],
 [15,-214,8,27,9],
 [-15,-238,8,19,9],
 [15,-259,9,29,10],
 [-15,-282,8,24,9],
 [15,-305,8,31,9]
];

for(let i=0;i<buildings.length;i++){
  const b=buildings[i];
  apartment(b[0],b[1],b[2],b[3],b[4],i);
}

/* =====================================================
   TREES / STREET LIGHTS
===================================================== */

function tree(x,z){

  const trunk=cube(.22,2.2,.22,mat(0x6a4124));
  trunk.position.set(x,1.1,z);
  scene.add(trunk);

  const crown=new THREE.Mesh(
    new THREE.SphereGeometry(1.35,14,10),
    mat(0x236b2d)
  );

  crown.position.set(x,3,z);
  crown.scale.y=1.15;
  crown.castShadow=true;
  scene.add(crown);
}

function lamp(x,z){

  addBox(x,2.7,z,.10,5.4,.10,MAT.black);
  addBox(
    x+(x<0?.7:-.7),
    5.25,
    z,
    1.4,
    .08,
    .08,
    MAT.black
  );

  const light=cube(.28,.18,.28,MAT.yellow);
  light.position.set(
    x+(x<0?1.35:-1.35),
    5.12,
    z
  );
  scene.add(light);
}

for(let z=-300;z<310;z+=20){
  tree(-10.5,z);
  tree(10.5,z+9);

  lamp(-7.45,z);
  lamp(7.45,z+10);
}

/* =====================================================
   DENSE CAR BODY
===================================================== */

/*
  Z축 방향이 차량의 앞뒤.
  +Z = 앞.
  촘촘한 단면을 연결해서 차체를 만듦.
*/

function makeDenseBody(color){

  const sections=[
    [-2.90,.78,.52],
    [-2.82,.90,.58],
    [-2.68,1.02,.65],
    [-2.48,1.10,.71],
    [-2.25,1.18,.77],
    [-2.00,1.23,.81],
    [-1.70,1.27,.84],
    [-1.35,1.30,.86],
    [-1.00,1.32,.87],
    [-.65,1.33,.88],
    [-.30,1.34,.89],
    [ .10,1.34,.90],
    [ .45,1.33,.89],
    [ .80,1.32,.88],
    [1.10,1.31,.87],
    [1.40,1.29,.85],
    [1.70,1.26,.82],
    [1.98,1.22,.78],
    [2.23,1.17,.73],
    [2.45,1.10,.67],
    [2.64,1.02,.61],
    [2.80,.91,.55],
    [2.90,.78,.49]
  ];

  const radial=32;

  const vertices=[];
  const indices=[];

  for(let s=0;s<sections.length;s++){

    const z=sections[s][0];
    const w=sections[s][1];
    const h=sections[s][2];

    for(let i=0;i<radial;i++){

      const a=i/radial*Math.PI*2;

      const x=Math.cos(a)*w;

      /* 아래쪽을 약간 평평하게 */
      let yy=Math.sin(a);

      let y=.48+yy*h;

      if(y<.18)y=.18;

      vertices.push(x,y,z);
    }
  }

  for(let s=0;s<sections.length-1;s++){

    for(let i=0;i<radial;i++){

      const a=s*radial+i;
      const b=s*radial+(i+1)%radial;
      const c=(s+1)*radial+(i+1)%radial;
      const d=(s+1)*radial+i;

      indices.push(a,b,c);
      indices.push(a,c,d);
    }
  }

  const geo=new THREE.BufferGeometry();

  geo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(vertices,3)
  );

  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mesh=new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({
      color:color,
      metalness:.55,
      roughness:.27
    })
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  return mesh;
}

/* =====================================================
   CAR
===================================================== */

function makeWheel(){

  const group=new THREE.Group();

  const tire=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .34,.34,.25,24
    ),
    MAT.tire
  );

  tire.rotation.z=Math.PI/2;
  tire.castShadow=true;
  group.add(tire);

  const rim=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .18,.18,.27,20
    ),
    MAT.rim
  );

  rim.rotation.z=Math.PI/2;
  group.add(rim);

  const hub=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .075,.075,.29,16
    ),
    MAT.black
  );

  hub.rotation.z=Math.PI/2;
  group.add(hub);

  return group;
}

function createCar(color=0x15181c){

  const car=new THREE.Group();

  /* dense body */
  const body=makeDenseBody(color);
  car.add(body);

  /* hood */
  const hood=cube(2.18,.38,1.35,
    new THREE.MeshStandardMaterial({
      color:color,
      metalness:.55,
      roughness:.25
    })
  );
  hood.position.set(0,.93,1.55);
  car.add(hood);

  /* trunk */
  const trunk=cube(2.15,.35,.75,
    new THREE.MeshStandardMaterial({
      color:color,
      metalness:.55,
      roughness:.25
    })
  );
  trunk.position.set(0,.98,-1.72);
  car.add(trunk);

  /* cabin */
  const cabin=new THREE.Mesh(
    new THREE.BoxGeometry(1.82,1.02,2.20),
    new THREE.MeshStandardMaterial({
      color:0x171b20,
      metalness:.4,
      roughness:.3
    })
  );
  cabin.position.set(0,1.30,-.12);
  cabin.scale.set(1,1,.98);
  cabin.castShadow=true;
  car.add(cabin);

  /* roof */
  const roof=cube(
    1.55,.08,1.72,
    MAT.black
  );
  roof.position.set(0,1.83,-.12);
  car.add(roof);

  /* windshield */
  const windshield=cube(
    1.52,.62,.045,
    MAT.glass
  );
  windshield.position.set(0,1.42,.76);
  windshield.rotation.x=-.48;
  car.add(windshield);

  /* rear glass */
  const rearGlass=cube(
    1.52,.62,.045,
    MAT.glass
  );
  rearGlass.position.set(0,1.42,-.98);
  rearGlass.rotation.x=.48;
  car.add(rearGlass);

  /* side windows */
  for(const side of [-1,1]){
    const sw=cube(
      .045,.55,1.55,
      MAT.glass
    );
    sw.position.set(side*.925,1.40,-.10);
    car.add(sw);
  }

  /* grille */
  const grille=cube(
    1.05,.30,.045,
    MAT.black
  );
  grille.position.set(0,.60,2.91);
  car.add(grille);

  /* grille bars */
  for(let i=-2;i<=2;i++){
    const bar=cube(
      .85,.025,.06,
      MAT.chrome
    );
    bar.position.set(0,.57+i*.055,2.94);
    car.add(bar);
  }

  /* front headlights */
  for(const side of [-1,1]){
    const head=cube(
      .38,.15,.06,
      MAT.yellow
    );
    head.position.set(side*.78,.78,2.88);
    car.add(head);
  }

  /* rear lights */
  for(const side of [-1,1]){
    const tail=cube(
      .40,.16,.06,
      MAT.red
    );
    tail.position.set(side*.78,.76,-2.91);
    car.add(tail);
  }

  /* bumpers */
  const frontB=cube(
    2.0,.18,.16,MAT.black
  );
  frontB.position.set(0,.43,2.90);
  car.add(frontB);

  const rearB=cube(
    2.0,.18,.16,MAT.black
  );
  rearB.position.set(0,.44,-2.90);
  car.add(rearB);

  /* mirrors */
  for(const side of [-1,1]){
    const mirror=cube(
      .18,.14,.32,
      MAT.black
    );
    mirror.position.set(side*1.12,1.17,.70);
    car.add(mirror);
  }

  /* door handles */
  for(const side of [-1,1]){
    for(const z of [-.45,.65]){
      const handle=cube(
        .035,.035,.18,
        MAT.chrome
      );
      handle.position.set(side*1.34,1.03,z);
      car.add(handle);
    }
  }

  /* wheels */
  const wheelPositions=[
    [-1.20,.46,1.55],
    [ 1.20,.46,1.55],
    [-1.20,.46,-1.55],
    [ 1.20,.46,-1.55]
  ];

  for(const p of wheelPositions){
    const w=makeWheel();
    w.position.set(p[0],p[1],p[2]);
    car.add(w);
  }

  return car;
}

/* =====================================================
   PLAYER
===================================================== */

const player={
  car:createCar(0x10151b),
  x:0,
  z:0,
  speed:0,
  rotation:0,
  damage:0,
  collisionCooldown:0
};

player.car.position.set(0,0,0);
scene.add(player.car);

/* =====================================================
   NPC
===================================================== */

const npcColors=[
  0xc62828,
  0x1f4f9a,
  0xe0b51c,
  0xeeeeee,
  0x26734a,
  0x6b2d8f,
  0xd76b1c,
  0x555b63
];

const npcs=[];

for(let i=0;i<12;i++){

  const car=createCar(npcColors[i%npcColors.length]);

  const lane=[-4.3,-1.45,1.45,4.3][i%4];

  const npc={
    car:car,
    x:lane,
    z:-30-i*42,
    speed:.25+(i%4)*.025
  };

  car.position.set(npc.x,0,npc.z);

  scene.add(car);
  npcs.push(npc);
}

/* =====================================================
   CONTROLS
===================================================== */

let gas=false;
let brake=false;
let steer=0;

const wheel=document.getElementById("wheel");

let wheelActive=false;

function steering(e){

  const r=wheel.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const dx=e.clientX-cx;

  steer=Math.max(-1,Math.min(1,dx/(r.width*.42)));

  wheel.style.transform=
    "rotate("+(-steer*38)+"deg)";
}

wheel.addEventListener("pointerdown",e=>{
  e.preventDefault();
  wheelActive=true;
  wheel.setPointerCapture(e.pointerId);
  steering(e);
});

wheel.addEventListener("pointermove",e=>{
  if(wheelActive)steering(e);
});

function releaseWheel(){
  wheelActive=false;
  steer*=.25;
  wheel.style.transform="rotate(0deg)";
}

wheel.addEventListener("pointerup",releaseWheel);
wheel.addEventListener("pointercancel",releaseWheel);

function hold(el,setter){

  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    setter(true);
    try{el.setPointerCapture(e.pointerId)}catch(x){}
  });

  const off=e=>{
    e.preventDefault();
    setter(false);
  };

  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
  el.addEventListener("pointerleave",off);
}

hold(
  document.getElementById("gas"),
  v=>gas=v
);

hold(
  document.getElementById("brake"),
  v=>brake=v
);

/* keyboard */
const keys={};

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key==="ArrowLeft")steer=-1;
  if(e.key==="ArrowRight")steer=1;
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;

  if(e.key==="ArrowLeft"&&!keys["arrowright"])steer=0;
  if(e.key==="ArrowRight"&&!keys["arrowleft"])steer=0;
});

/* =====================================================
   CAMERA
===================================================== */

let cameraMode=1;

const camButton=document.getElementById("cam");

function changeCamera(){

  cameraMode++;

  if(cameraMode>3)
    cameraMode=1;

  camButton.textContent="CAM "+cameraMode;
}

camButton.addEventListener("click",changeCamera);
camButton.addEventListener("pointerdown",e=>e.stopPropagation());

/* =====================================================
   PHYSICS
===================================================== */

function update(dt){

  if(!gameStarted)return;

  const accelerate=
    gas ||
    keys["w"] ||
    keys["arrowup"];

  const braking=
    brake ||
    keys["s"] ||
    keys["arrowdown"];

  /* acceleration */
  if(accelerate){
    player.speed+=.018*dt;
  }else{
    player.speed-=.006*dt;
  }

  if(braking){
    player.speed-=.035*dt;
  }

  player.speed=Math.max(
    0,
    Math.min(player.speed,1.45)
  );

  /* sidewalk slowdown */
  const side=Math.abs(player.x);

  if(side>6.8 && side<9.4){

    player.speed*=Math.pow(.91,dt);

    if(player.speed>.32)
      player.speed=.32;
  }

  /* grass */
  if(side>=9.4){

    player.speed*=Math.pow(.82,dt);

    if(player.speed>.12)
      player.speed=.12;
  }

  /* steering */
  if(Math.abs(steer)>.02){

    player.rotation-=
      steer*
      (.010+.016*player.speed)*
      dt;
  }

  /* return steering slightly */
  if(!wheelActive){
    steer*=Math.pow(.92,dt);
  }

  /* movement */
  player.x+=
    Math.sin(player.rotation)*
    player.speed*
    dt*
    1.8;

  player.z+=
    Math.cos(player.rotation)*
    player.speed*
    dt*
    4.0;

  /* road boundaries */
  if(player.x>11){
    player.x=11;
    player.speed*=.8;
  }

  if(player.x<-11){
    player.x=-11;
    player.speed*=.8;
  }

  /* collision cooldown */
  if(player.collisionCooldown>0)
    player.collisionCooldown-=dt;

  /* NPC */
  for(const npc of npcs){

    npc.z+=npc.speed*dt;

    if(npc.z>player.z+120){

      npc.z=
        player.z-
        500-
        Math.random()*250;

      npc.x=
        [-4.3,-1.45,1.45,4.3]
        [Math.floor(Math.random()*4)];
    }

    const dx=Math.abs(npc.x-player.x);
    const dz=Math.abs(npc.z-player.z);

    if(
      dx<2.15 &&
      dz<4.0 &&
      player.collisionCooldown<=0
    ){

      player.collisionCooldown=35;

      /* 실제 충돌처럼 감속 + 방향 밀림 */
      player.speed*=.25;

      player.rotation+=
        (player.x<npc.x?-1:1)*
        (.10+Math.random()*.12);

      player.x+=
        (player.x<npc.x?-1:1)*.7;

      player.damage+=
        4+Math.random()*7;

      if(player.damage>100)
        player.damage=100;
    }

    npc.car.position.set(
      npc.x,
      0,
      npc.z
    );
  }

  /* player visual */
  player.car.position.set(
    player.x,
    0,
    player.z
  );

  player.car.rotation.y=player.rotation;

  /* wheel steering visual */
  const wheels=player.car.children.filter(
    o=>o.userData.isWheel
  );

  document.getElementById("speed").textContent=
    Math.round(player.speed*92)+" KM/H";

  document.getElementById("damage").textContent=
    "DAMAGE "+Math.round(player.damage)+"%";
}

/* mark wheels */
player.car.traverse(o=>{
  if(
    o.geometry &&
    o.geometry.type==="CylinderGeometry"
  ){
    o.userData.isWheel=true;
  }
});

/* =====================================================
   CAMERA UPDATE
===================================================== */

const camTarget=new THREE.Vector3();

function updateCamera(){

  const fx=Math.sin(player.rotation);
  const fz=Math.cos(player.rotation);

  let x,y,z;

  if(cameraMode===1){

    /* chase */
    x=player.x-fx*10;
    y=5.0;
    z=player.z-fz*10;

    camTarget.set(
      player.x+fx*8,
      1.1,
      player.z+fz*8
    );

  }else if(cameraMode===2){

    /* hood */
    x=player.x-fx*2.3;
    y=2.25;
    z=player.z-fz*2.3;

    camTarget.set(
      player.x+fx*15,
      1.0,
      player.z+fz*15
    );

  }else{

    /* high */
    x=player.x-fx*16;
    y=9;
    z=player.z-fz*16;

    camTarget.set(
      player.x+fx*12,
      0,
      player.z+fz*12
    );
  }

  camera.position.lerp(
    new THREE.Vector3(x,y,z),
    .12
  );

  camera.lookAt(camTarget);
}

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.7)
  );
});

/* =====================================================
   LOOP
===================================================== */

let last=performance.now();

function loop(now){

  requestAnimationFrame(loop);

  const dt=Math.min(
    (now-last)/16.666,
    2
  );

  last=now;

  update(dt);
  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

requestAnimationFrame(loop);

</script>
