<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>D.T.B. DRIVE // STUDIO</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070a;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

button{
  border:0;
  color:white;
  background:rgba(15,18,23,.9);
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

#rotateNotice{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#05070a;
  font-size:20px;
  font-weight:900;
}

@media (orientation:portrait){
  #rotateNotice{display:flex}
}

#menu{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(20,35,55,.4),#030507 70%);
}

.menuBox{
  width:min(850px,92vw);
  max-height:94vh;
  overflow:auto;
  padding:35px;
  border-radius:25px;
  background:rgba(7,10,14,.92);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 30px 100px #000;
}

.logo{
  font-size:clamp(50px,9vw,100px);
  font-weight:1000;
  letter-spacing:-6px;
  font-style:italic;
}

.sub{
  color:#7f8b9c;
  letter-spacing:5px;
  margin-bottom:28px;
}

.sectionTitle{
  font-size:12px;
  color:#788596;
  letter-spacing:2px;
  margin:20px 0 10px;
}

.cars{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.carChoice{
  padding:14px;
  min-height:70px;
  text-align:left;
  transition:.15s;
}

.carChoice.selected{
  border-color:#fff;
  background:#202732;
  transform:translateY(-2px);
}

.carName{
  font-size:16px;
  font-weight:900;
}

.carDesc{
  font-size:10px;
  color:#7d8997;
  margin-top:5px;
}

.options{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.option{
  padding:12px 18px;
}

.option.selected{
  background:#fff;
  color:#080a0d;
}

.start{
  width:100%;
  padding:17px;
  margin-top:25px;
  background:#fff;
  color:#080a0d;
  font-size:17px;
}

#loading{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#05070a;
}

.loader{
  width:min(400px,70vw);
  height:5px;
  background:#20252c;
  border-radius:10px;
  overflow:hidden;
  margin-top:20px;
}

#loadbar{
  width:0%;
  height:100%;
  background:white;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  display:none;
}

.speedBox{
  position:absolute;
  left:22px;
  bottom:20px;
  font-weight:900;
  text-shadow:0 3px 12px #000;
}

#speed{
  font-size:54px;
  font-style:italic;
}

.kmh{
  color:#9ba5b2;
  font-size:12px;
  letter-spacing:2px;
}

#camLabel{
  position:absolute;
  top:18px;
  right:20px;
  padding:9px 13px;
  border-radius:10px;
  background:rgba(0,0,0,.5);
  font-size:11px;
  letter-spacing:2px;
}

#damageHud{
  position:absolute;
  top:52px;
  right:20px;
  font-size:11px;
  color:#aaa;
}

#controls{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:none;
}

#steer{
  pointer-events:auto;
  position:absolute;
  left:25px;
  bottom:25px;
  width:145px;
  height:145px;
  border-radius:50%;
  border:13px solid #161a20;
  background:
    radial-gradient(circle,#303842 0 12%,#11151a 13% 20%,transparent 21%);
  box-shadow:
    inset 0 0 0 3px #59616c,
    0 8px 30px rgba(0,0,0,.6);
  touch-action:none;
}

#steer:before,
#steer:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:76px;
  height:13px;
  border-radius:10px;
  background:#343c46;
  transform-origin:left center;
}

#steer:before{
  transform:translate(0,-50%) rotate(145deg);
}

#steer:after{
  transform:translate(0,-50%) rotate(35deg);
}

.steerHub{
  position:absolute;
  left:50%;
  top:50%;
  width:42px;
  height:42px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#242a32;
  border:3px solid #69727d;
}

.steerMark{
  position:absolute;
  width:5px;
  height:22px;
  background:#eee;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  border-radius:4px;
}

.pedal{
  pointer-events:auto;
  position:absolute;
  right:25px;
  bottom:30px;
  width:90px;
  height:65px;
  border-radius:15px;
  font-size:11px;
  letter-spacing:2px;
  touch-action:none;
}

#brake{
  right:125px;
}

#camBtn{
  pointer-events:auto;
  position:absolute;
  right:25px;
  top:25px;
  width:70px;
  height:48px;
}

#pauseBtn{
  pointer-events:auto;
  position:absolute;
  right:105px;
  top:25px;
  width:70px;
  height:48px;
}

#pause{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(8px);
}

.pauseBox{
  width:300px;
  padding:25px;
  border-radius:20px;
  background:#0b0f14;
  border:1px solid #29313b;
}

.pauseBox h2{
  margin-top:0;
}

.pauseBox button{
  width:100%;
  padding:13px;
  margin-top:8px;
}

#flash{
  position:fixed;
  inset:0;
  z-index:30;
  pointer-events:none;
  opacity:0;
  background:white;
}

@media(max-width:850px){
  .menuBox{padding:22px}
  .cars{grid-template-columns:repeat(2,1fr)}
  #steer{
    width:120px;
    height:120px;
    border-width:11px;
  }
  #speed{font-size:40px}
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="rotateNotice">
  📱<br><br>
  휴대폰을 가로로 돌려주세요
</div>

<div id="menu">
  <div class="menuBox">
    <div class="logo">D.T.B.</div>
    <div class="sub">DRIVE // STUDIO</div>

    <div class="sectionTitle">SELECT VEHICLE</div>

    <div class="cars">

      <button class="carChoice selected" data-car="sedan">
        <div class="carName">NOVA S</div>
        <div class="carDesc">BALANCED SEDAN · 210 KM/H</div>
      </button>

      <button class="carChoice" data-car="suv">
        <div class="carName">TITAN X</div>
        <div class="carDesc">SUV · HIGH GRIP · 190 KM/H</div>
      </button>

      <button class="carChoice" data-car="sport">
        <div class="carName">VORTEX R</div>
        <div class="carDesc">SPORT · 245 KM/H</div>
      </button>

      <button class="carChoice" data-car="super">
        <div class="carName">RAPTOR GT</div>
        <div class="carDesc">SUPERCAR · 315 KM/H</div>
      </button>

      <button class="carChoice" data-car="truck">
        <div class="carName">TITAN HAULER</div>
        <div class="carDesc">TRUCK · HEAVY BODY</div>
      </button>

      <button class="carChoice" data-car="electric">
        <div class="carName">VOLT E</div>
        <div class="carDesc">ELECTRIC · 260 KM/H</div>
      </button>

    </div>

    <div class="sectionTitle">CAMERA</div>

    <div class="options">
      <button class="option selected" data-cam="third">
        THIRD PERSON
      </button>
      <button class="option" data-cam="first">
        FIRST PERSON
      </button>
    </div>

    <div class="sectionTitle">WEATHER</div>

    <div class="options">
      <button class="option selected" data-weather="clear">
        CLEAR
      </button>
      <button class="option" data-weather="rain">
        RAIN
      </button>
      <button class="option" data-weather="night">
        NIGHT
      </button>
    </div>

    <button class="start" id="startBtn">
      START DRIVE
    </button>
  </div>
</div>

<div id="loading">
  <div>D.T.B. DRIVE</div>
  <div id="loadText">INITIALIZING VEHICLE...</div>
  <div class="loader">
    <div id="loadbar"></div>
  </div>
</div>

<div id="hud">
  <div class="speedBox">
    <span id="speed">0</span>
    <span class="kmh">KM/H</span>
  </div>

  <div id="camLabel">THIRD PERSON</div>
  <div id="damageHud">DAMAGE 0%</div>
</div>

<div id="controls">

  <div id="steer">
    <div class="steerHub"></div>
    <div class="steerMark"></div>
  </div>

  <button class="pedal" id="brake">BRAKE</button>
  <button class="pedal" id="accel">ACCEL</button>

  <button id="camBtn">CAM</button>
  <button id="pauseBtn">Ⅱ</button>

</div>

<div id="flash"></div>

<div id="pause">
  <div class="pauseBox">
    <h2>PAUSED</h2>
    <button id="resume">RESUME</button>
    <button id="restart">RESTART</button>
    <button id="home">HOME</button>
  </div>
</div>

<script type="module">

import * as THREE from "three";

import {
  RoundedBoxGeometry
} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/geometries/RoundedBoxGeometry.js";


/* =========================================================
   BASIC
========================================================= */

let scene;
let renderer;
let camera;
let cockpitCamera;

let clock = new THREE.Clock();

let player = null;
let interior = null;

let traffic = [];
let debris = [];
let rain = [];

let running = false;
let paused = false;

let selectedCar = "sedan";
let weather = "clear";
let cameraMode = "third";

let cameraYaw = 0;
let cameraPitch = .28;

let steering = 0;
let wheelVisual = 0;

let keys = {};

let touchSteer = 0;
let accelTouch = false;
let brakeTouch = false;

let world = new THREE.Group();

const roadLength = 1200;


/* =========================================================
   VEHICLE DATA
========================================================= */

const vehicleData = {

  sedan:{
    max:210,
    acc:30,
    grip:.93,
    color:0xd7d9dc,
    scale:1
  },

  suv:{
    max:190,
    acc:25,
    grip:.98,
    color:0x30353b,
    scale:1.08
  },

  sport:{
    max:245,
    acc:36,
    grip:.90,
    color:0x1876d2,
    scale:.96
  },

  super:{
    max:315,
    acc:45,
    grip:.82,
    color:0xd51f2b,
    scale:.91
  },

  truck:{
    max:145,
    acc:18,
    grip:.99,
    color:0x243d64,
    scale:1.18
  },

  electric:{
    max:260,
    acc:50,
    grip:.87,
    color:0x24cda8,
    scale:.98
  }

};


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function mat(color,rough=.55,metal=.15){

  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal
  });

}

const blackMat = mat(0x090b0e,.38,.7);
const tireMat = mat(0x08090a,.9,.05);
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0x07111b,
  roughness:.12,
  metalness:.15,
  transmission:.12,
  transparent:true,
  opacity:.75
});

const chromeMat = mat(0xbcc4ce,.18,.9);

const redMat = mat(0x9c1018,.3,.2);
const whiteLightMat = mat(0xf2f4ff,.15,.6);
const orangeMat = mat(0xff8b20,.25,.3);


/* =========================================================
   GEOMETRY HELPERS
========================================================= */

function box(
  group,
  x,y,z,
  sx,sy,sz,
  material,
  radius=.05,
  name=""
){

  const geo = radius > 0
    ? new RoundedBoxGeometry(
        sx,sy,sz,
        3,
        Math.min(radius,Math.min(sx,sy,sz)/3)
      )
    : new THREE.BoxGeometry(sx,sy,sz);

  const mesh = new THREE.Mesh(geo,material);

  mesh.position.set(x,y,z);
  mesh.name=name;

  group.add(mesh);

  return mesh;
}


function cyl(
  group,
  x,y,z,
  radius,
  depth,
  material,
  rotX=Math.PI/2
){

  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius,
      depth,
      24
    ),
    material
  );

  mesh.position.set(x,y,z);
  mesh.rotation.x=rotX;

  group.add(mesh);

  return mesh;
}


/* =========================================================
   DETAILED CAR
========================================================= */

function createVehicle(type,color){

  const root = new THREE.Group();

  root.userData.type=type;

  root.userData.velocity =
    new THREE.Vector3();

  root.userData.angularVelocity =
    new THREE.Vector3();

  root.userData.damage=0;

  root.userData.crashed=false;

  root.userData.cooldown=0;

  root.userData.parts=[];

  root.userData.wheels=[];

  const data=vehicleData[type];

  const bodyMat=mat(color,.35,.35);

  const trimMat=blackMat;


  /*
    DIMENSIONS
  */

  let W=2.05;
  let H=1.05;
  let L=4.45;

  if(type==="suv"){
    W=2.15;
    H=1.35;
    L=4.65;
  }

  if(type==="sport"){
    W=2.0;
    H=.85;
    L=4.35;
  }

  if(type==="super"){
    W=2.02;
    H=.76;
    L=4.55;
  }

  if(type==="truck"){
    W=2.35;
    H=1.55;
    L=6.2;
  }

  if(type==="electric"){
    W=2.04;
    H=.98;
    L=4.65;
  }


  /* BODY MAIN */

  const lower=box(
    root,
    0,.72,0,
    W, .65,L,
    bodyMat,.18,
    "BODY"
  );

  lower.userData.partType="body";


  /* SIDE SKIRTS */

  for(const x of [-W/2-.025,W/2+.025]){

    box(
      root,
      x,.57,0,
      .08,.23,L*.78,
      trimMat,.03,
      "SIDE_SKIRT"
    );

  }


  /* HOOD */

  const hood=box(
    root,
    0,1.12,-L*.31,
    W*.84,.18,L*.31,
    bodyMat,.09,
    "HOOD"
  );

  hood.userData.partType="hood";
  root.userData.parts.push(hood);


  /* ROOF / CABIN */

  let roofW=W*.76;
  let roofH=.78;
  let roofL=L*.43;

  if(type==="truck"){

    roofW=W*.78;
    roofH=1.05;
    roofL=1.9;

  }

  const cabin=box(
    root,
    0,
    type==="truck"?1.62:1.43,
    type==="truck"?-.85:-.15,
    roofW,
    roofH,
    roofL,
    bodyMat,
    .16,
    "CABIN"
  );


  /* WINDSHIELDS */

  const frontGlass=box(
    root,
    0,
    type==="truck"?1.73:1.53,
    type==="truck"?-1.8:-.92,
    roofW*.88,
    roofH*.63,
    .035,
    glassMat,
    .015,
    "FRONT_WINDOW"
  );

  frontGlass.rotation.x=
    type==="truck" ? -.06 : -.22;

  frontGlass.userData.glass=true;

  const rearGlass=box(
    root,
    0,
    type==="truck"?1.73:1.53,
    type==="truck":.12:.63,
    roofW*.88,
    roofH*.61,
    .035,
    glassMat,
    .015,
    "REAR_WINDOW"
  );

  rearGlass.rotation.x=
    type==="truck" ? .02 : .22;

  rearGlass.userData.glass=true;


  /* SIDE WINDOWS */

  const sideWindowParts=[];

  for(const x of [-roofW/2-.018,roofW/2+.018]){

    const side=box(
      root,
      x,
      type==="truck"?1.67:1.48,
      type==="truck"-.85:-.15,
      .035,
      roofH*.57,
      roofL*.86,
      glassMat,
      .015,
      "SIDE_WINDOW"
    );

    side.userData.glass=true;

    sideWindowParts.push(side);

  }


  /* A/B/C PILLARS */

  for(const x of [-roofW/2-.035,roofW/2+.035]){

    for(const z of [
      type==="truck"?-1.68:-.86,
      type==="truck"?-.82:-.15,
      type==="truck"?-.02:.55
    ]){

      box(
        root,
        x,
        type==="truck"?1.67:1.48,
        z,
        .07,
        roofH*.72,
        .09,
        trimMat,
        .02
      );

    }

  }


  /* DOORS + PANEL LINES */

  const doorZ=[
    -.15,
    .68
  ];

  for(const x of [-W/2-.042,W/2+.042]){

    for(const z of doorZ){

      const door=box(
        root,
        x,
        .82,
        z,
        .035,
        .58,
        .72,
        trimMat,
        .015,
        "DOOR_PANEL"
      );

      door.userData.partType="door";

      root.userData.parts.push(door);


      /* HANDLE */

      box(
        root,
        x*1.002,
        1.03,
        z+.12,
        .045,
        .035,
        .18,
        chromeMat,
        .015
      );

    }

  }


  /* CENTER BODY CREASES */

  for(const x of [-W/2+.16,W/2-.16]){

    box(
      root,
      x,
      .96,
      0,
      .025,
      .045,
      L*.83,
      chromeMat,
      .005
    );

  }


  /* BUMPERS */

  const frontBumper=box(
    root,
    0,.63,-L/2-.10,
    W*1.01,.25,.20,
    trimMat,.07,
    "FRONT_BUMPER"
  );

  const rearBumper=box(
    root,
    0,.63,L/2+.10,
    W*1.01,.25,.20,
    trimMat,.07,
    "REAR_BUMPER"
  );

  frontBumper.userData.partType="bumper";
  rearBumper.userData.partType="bumper";

  root.userData.parts.push(frontBumper,rearBumper);


  /* FRONT GRILLE */

  if(type!=="electric"){

    box(
      root,
      0,.78,-L/2-.112,
      W*.48,.20,.035,
      blackMat,.02,
      "GRILLE"
    );

    for(let i=-2;i<=2;i++){

      box(
        root,
        i*W*.085,
        .78,
        -L/2-.14,
        .025,.13,.025,
        chromeMat,.005
      );

    }

  }else{

    box(
      root,
      0,.77,-L/2-.115,
      W*.55,.17,.035,
      blackMat,.02
    );

  }


  /* HEADLIGHTS */

  for(const x of [-W*.33,W*.33]){

    box(
      root,
      x,.90,-L/2-.13,
      W*.21,.17,.045,
      whiteLightMat,.04,
      "HEADLIGHT"
    );

    box(
      root,
      x,.71,-L/2-.135,
      W*.14,.035,.04,
      orangeMat,.01
    );

  }


  /* TAILLIGHTS */

  for(const x of [-W*.36,W*.36]){

    box(
      root,
      x,.88,L/2+.13,
      W*.22,.18,.045,
      redMat,.04,
      "TAIL_LIGHT"
    );

  }


  /* LOWER AIR INTAKES */

  for(const x of [-W*.27,0,W*.27]){

    box(
      root,
      x,.54,-L/2-.115,
      W*.17,.10,.04,
      blackMat,.02
    );

  }


  /* MIRRORS */

  for(const x of [-W/2-.19,W/2+.19]){

    const mirror=box(
      root,
      x,1.25,-.67,
      .18,.14,.28,
      trimMat,.06,
      "MIRROR"
    );

    mirror.userData.partType="mirror";

    root.userData.parts.push(mirror);

  }


  /* WHEELS */

  const wheelX=W/2+.08;
  const wheelZ=L*.34;

  for(const x of [-wheelX,wheelX]){

    for(const z of [-wheelZ,wheelZ]){

      const tire=cyl(
        root,
        x,.53,z,
        .38,
        .25,
        tireMat
      );

      tire.userData.isWheel=true;

      const rim=cyl(
        root,
        x,.53,z-.14,
        .22,
        .265,
        chromeMat
      );

      rim.userData.isWheel=true;

      const hub=cyl(
        root,
        x,.53,z-.17,
        .08,
        .275,
        blackMat
      );

      hub.userData.isWheel=true;

      root.userData.wheels.push(tire,rim,hub);

    }

  }


  /* WHEEL ARCHES */

  for(const x of [-W/2-.05,W/2+.05]){

    for(const z of [-wheelZ,wheelZ]){

      const arch=box(
        root,
        x,
        .70,
        z,
        .09,
        .72,
        .83,
        trimMat,
        .30
      );

/* =========================================================
   DAMAGE SYSTEM
========================================================= */

function damageVehicle(car,impact,normal){

  if(!car || !car.userData)return;

  car.userData.damage += impact*.34;

  car.userData.damage=
    Math.min(100,car.userData.damage);


  /* visual body deformation */

  const side =
    normal ? Math.sign(normal.x) : 0;

  car.userData.damageSide=side;


  const parts=car.userData.parts || [];

  for(const p of parts){

    if(p.userData.detached)continue;

    const type=p.userData.partType;

    if(
      type==="bumper" &&
      impact>12
    ){

      p.position.z +=
        p.name==="FRONT_BUMPER"
        ? Math.min(.42,impact*.008)
        : -Math.min(.42,impact*.008);

      p.rotation.x +=
        (Math.random()-.5)*impact*.015;

    }


    if(
      type==="hood" &&
      impact>20
    ){

      p.rotation.x +=
        impact*.008;

      p.position.y +=
        Math.min(.22,impact*.004);

    }


    if(
      type==="door" &&
      impact>30 &&
      Math.random()<.18
    ){

      p.rotation.y +=
        side*.12;

    }


    if(
      type==="mirror" &&
      impact>22 &&
      Math.random()<.35
    ){

      detachPart(car,p,impact);

    }


    if(
      type==="spoiler" &&
      impact>40 &&
      Math.random()<.3
    ){

      detachPart(car,p,impact);

    }

  }


  /* windows */

  if(impact>22){

    breakWindows(car,impact);

  }


  /* airbag */

  if(
    cameraMode==="first" &&
    impact>30
  ){

    deployAirbag(car);

  }


  /* destroyed state */

  if(car.userData.damage>85){

    car.userData.crashed=true;

  }

}


function detachPart(car,part,impact){

  if(part.userData.detached)return;

  part.userData.detached=true;

  const worldPos=new THREE.Vector3();

  part.getWorldPosition(worldPos);

  const piece=part.clone();

  piece.position.copy(worldPos);

  piece.quaternion.copy(part.getWorldQuaternion(
    new THREE.Quaternion()
  ));

  scene.add(piece);

  piece.userData.velocity=
    new THREE.Vector3(
      (Math.random()-.5)*impact*.045,
      .5+Math.random()*impact*.015,
      (Math.random()-.5)*impact*.045
    );

  piece.userData.angularVelocity=
    new THREE.Vector3(
      Math.random()*5,
      Math.random()*5,
      Math.random()*5
    );

  piece.userData.life=4;

  debris.push(piece);

  part.visible=false;

}


/* =========================================================
   WINDOW BREAK
========================================================= */

function breakWindows(car,impact){

  if(car.userData.windowsBroken)return;

  car.userData.windowsBroken=true;

  car.traverse(obj=>{

    if(
      obj.isMesh &&
      obj.userData.glass
    ){

      obj.visible=false;

      const wp=new THREE.Vector3();

      obj.getWorldPosition(wp);

      for(let i=0;i<10;i++){

        const shard=new THREE.Mesh(
          new THREE.TetrahedronGeometry(
            .06+Math.random()*.09
          ),
          new THREE.MeshPhysicalMaterial({
            color:0x8db7c8,
            transparent:true,
            opacity:.65,
            roughness:.1,
            metalness:.1
          })
        );

        shard.position.copy(wp);

        shard.userData.velocity=
          new THREE.Vector3(
            (Math.random()-.5)*impact*.035,
            Math.random()*impact*.02,
            (Math.random()-.5)*impact*.035
          );

        shard.userData.angularVelocity=
          new THREE.Vector3(
            Math.random()*8,
            Math.random()*8,
            Math.random()*8
          );

        shard.userData.life=2.5;

        scene.add(shard);

        debris.push(shard);

      }

    }

  });

}

/* =========================================================
   COLLISION
========================================================= */

function collide(a,b){

  if(
    !a ||
    !b ||
    a.userData.cooldown>0 ||
    b.userData.cooldown>0
  )return;

  const delta=
    new THREE.Vector3()
      .subVectors(b.position,a.position);

  delta.y=0;

  const distance=delta.length();

  if(distance>3.25)return;

  if(distance<.01)
    delta.set(1,0,0);

  delta.normalize();


  /*
    RELATIVE VELOCITY
    Gives much more natural collision impulse.
  */

  const av=a.userData.velocity || new THREE.Vector3();

  const bv=b.userData.velocity || new THREE.Vector3();

  const relative=
    new THREE.Vector3()
      .subVectors(av,bv);

  const relativeSpeed=
    Math.abs(relative.dot(delta));


  const impact=
    Math.max(
      8,
      relativeSpeed*2.5
    );


  /* DAMAGE BOTH */

  damageVehicle(
    a,
    impact,
    delta
  );

  damageVehicle(
    b,
    impact,
    delta.clone().multiplyScalar(-1)
  );


  /* PHYSICAL SEPARATION */

  const penetration=
    3.25-distance;

  a.position.addScaledVector(
    delta,
    -penetration*.42
  );

  b.position.addScaledVector(
    delta,
    penetration*.42
  );


  /*
    IMPULSE
  */

  const impulse=
    Math.min(18,impact*.055);

  a.userData.velocity.addScaledVector(
    delta,
    -impulse
  );

  b.userData.velocity.addScaledVector(
    delta,
    impulse
  );


  /* SIDE SPIN */

  const spin=
    THREE.MathUtils.clamp(
      relative.x*.08,
      -1.8,
      1.8
    );

  a.userData.angularVelocity.y += spin;
  b.userData.angularVelocity.y -= spin;


  /* SLOW DOWN */

  a.userData.velocity.multiplyScalar(.72);
  b.userData.velocity.multiplyScalar(.82);

  a.userData.cooldown=.22;
  b.userData.cooldown=.22;


  /* SCREEN FLASH */

  if(a===player){

    flashCrash();

  }else if(b===player){

    flashCrash();

  }

}

const steerEl=

  "pointerdown",

/* =========================================================
   CAMERA
========================================================= */

function toggleCamera(){

  cameraMode=
    cameraMode==="third"
      ? "first"
      : "third";

  updateCameraLabel();

}


function updateCameraLabel(){

  document.getElementById("camLabel").textContent=
    cameraMode==="third"
      ? "THIRD PERSON"
      : "FIRST PERSON";

}


function updateCamera(dt){

  if(!player)return;


  if(cameraMode==="first"){

    cockpitCamera.aspect=
      innerWidth/innerHeight;

    cockpitCamera.updateProjectionMatrix();

    /*
      Camera is parented to car,
      so it automatically follows:
      - x movement
      - yaw
      - roll
      - pitch
    */

    cockpitCamera.rotation.z=
      THREE.MathUtils.lerp(
        cockpitCamera.rotation.z,
        -player.rotation.z*.45,
        dt*8
      );

    cockpitCamera.rotation.x=
      THREE.MathUtils.lerp(
        cockpitCamera.rotation.x,
        player.rotation.x*.35,
        dt*8
      );

    renderer.render(
      scene,
      cockpitCamera
    );

    return;

  }


  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();


  const target=new THREE.Vector3(
    player.position.x,
    1.05,
    player.position.z-.1
  );


  const distance=7.5;

  const horizontal=
    Math.cos(cameraPitch)*distance;

  const vertical=
    Math.sin(cameraPitch)*distance;


  const desired=new THREE.Vector3(
    target.x+
      Math.sin(cameraYaw)*horizontal,
    target.y+vertical,
    target.z+
      Math.cos(cameraYaw)*horizontal
  );


  camera.position.lerp(
    desired,
    1-Math.pow(.001,dt)
  );

  camera.lookAt(target);

  renderer.render(
    scene,
    camera
  );

}

========================================================= */

let cameraDragging=false;
let camPX=0;
let camPY=0;

rendererDummy();

function rendererDummy(){}

window.addEventListener(
  "pointerdown",
  e=>{

    if(e.target.id==="steer")return;

    if(
      e.target.closest &&
      e.target.closest("button")
    )return;

    if(cameraMode!=="third")return;

    cameraDragging=true;

    camPX=e.clientX;
    camPY=e.clientY;

  }
);

window.addEventListener(
  "pointermove",
  e=>{

    if(!cameraDragging)return;

    const dx=e.clientX-camPX;
    const dy=e.clientY-camPY;

    camPX=e.clientX;
    camPY=e.clientY;

    cameraYaw -= dx*.008;

    cameraPitch += dy*.006;

    cameraPitch=
      THREE.MathUtils.clamp(
        cameraPitch,
        -.15,
        .9
      );

  }
);

window.addEventListener(
  "pointerup",
  ()=>{
    cameraDragging=false;
  }
);


/* =========================================================
   PHYSICS
========================================================= */

function updatePlayer(dt){

  if(!player)return;


  const data=
    vehicleData[selectedCar];


  const s=getSteering();

  steering=
    THREE.MathUtils.lerp(
      steering,
      s,
      dt*8
    );


  let forward=
    -player.userData.velocity.z;


  /*
    ACCEL
  */

  const accel=
    keys.KeyW ||
    keys.ArrowUp ||
    accelTouch;


  const brake=
    keys.KeyS ||
    keys.ArrowDown ||
    brakeTouch;


  if(accel){

    player.userData.velocity.z -=
      data.acc*dt*.45;

  }


  if(brake){

    player.userData.velocity.z +=
      55*dt*.5;

  }


  /*
    NATURAL ROLLING RESISTANCE
  */

  player.userData.velocity.z *=
    Math.pow(.992,dt*60);


  /*
    MAX SPEED
  */

  const maxWorldSpeed=
    data.max*.24;

  player.userData.velocity.z=
    THREE.MathUtils.clamp(
      player.userData.velocity.z,
      -maxWorldSpeed,
      25
    );


  /*
    STEERING
  */

  const speedAbs=
    Math.abs(player.userData.velocity.z);

  const steerPower=
    THREE.MathUtils.clamp(
      speedAbs/12,
      .15,
      1
    );


  player.userData.velocity.x +=
    steering*
    steerPower*
    dt*
    8;


  /*
    GRIP
  */

  player.userData.velocity.x *=
    Math.pow(
      data.grip,
      dt*8
    );


  /*
    PLAYER POSITION
  */

  player.position.x +=
    player.userData.velocity.x*dt;


  player.position.z +=
    player.userData.velocity.z*dt;


  /*
    KEEP PLAYER NEAR ROAD
  */

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -8.2,
      8.2
    );


  /*
    CAR BODY ROLL / PITCH
  */

  const lateral=
    player.userData.velocity.x;

  const longitudinal=
    player.userData.velocity.z;


  player.rotation.y=
    THREE.MathUtils.lerp(
      player.rotation.y,
      -steering*.14,
      dt*7
    );


  player.rotation.z=
    THREE.MathUtils.lerp(
      player.rotation.z,
      -lateral*.035,
      dt*7
    );


  player.rotation.x=
    THREE.MathUtils.lerp(
      player.rotation.x,
      longitudinal*.006,
      dt*5
    );


  /*
    ANGULAR PHYSICS AFTER CRASH
  */

  player.rotation.y +=
    player.userData.angularVelocity.y*dt;

  player.rotation.z +=
    player.userData.angularVelocity.z*dt;

  player.rotation.x +=
    player.userData.angularVelocity.x*dt;


  player.userData.angularVelocity.multiplyScalar(
    Math.pow(.08,dt)
  );


  /* wheels */

  for(const wheel of player.userData.wheels){

    wheel.rotation.z +=
      -player.userData.velocity.z*dt*3;

  }


  /*
    STEERING WHEEL VISUAL
  */

  wheelVisual=
    THREE.MathUtils.lerp(
      wheelVisual,
      steering*65,
      dt*10
    );

  const steeringWheel=
    player.userData.interior?.children
      .find(o=>o.type==="Group");

  if(steeringWheel){

    steeringWheel.rotation.z=
      THREE.MathUtils.degToRad(
        wheelVisual
      );

  }


  /* airbag */

  const bag=player.userData.airbag;

  if(
    bag &&
    bag.userData.deploying
  ){

    bag.scale.lerp(
      new THREE.Vector3(1.7,1.25,1.4),
      dt*8
    );

  }


  /* cooldown */

  player.userData.cooldown=
    Math.max(
      0,
      player.userData.cooldown-dt
    );

}


/* =========================================================
   TRAFFIC PHYSICS
========================================================= */

function updateTraffic(dt){

  for(const car of traffic){

    if(!car.parent)continue;


    car.userData.cooldown=
      Math.max(
        0,
        car.userData.cooldown-dt
      );


    const v=car.userData.velocity;


    /*
      TRAFFIC FORWARD
    */

    car.position.z +=
      v.z*dt;


    /*
      SMALL LANE MOVEMENT
    */

    const difference=
      car.userData.laneTarget-
      car.position.x;

    car.userData.velocity.x +=
      difference*.15*dt;

    car.userData.velocity.x *=
      Math.pow(.04,dt);

    car.position.x +=
      car.userData.velocity.x*dt;


    /*
      BODY MOVEMENT
    */

    car.rotation.z=
      THREE.MathUtils.lerp(
        car.rotation.z,
        -car.userData.velocity.x*.025,
        dt*5
      );


    car.rotation.y +=
      car.userData.angularVelocity.y*dt;


    car.userData.angularVelocity.multiplyScalar(
      Math.pow(.1,dt)
    );


    /*
      RESPAWN
    */

    if(car.position.z>30){

      car.position.z=
        -900-Math.random()*350;

      car.position.x=
        [-6,-3,3,6][
          Math.floor(Math.random()*4)
        ];

      car.userData.damage=0;
      car.userData.crashed=false;

    }


    /* collision */

    if(player){

      collide(player,car);

    }

  }

}


/* =========================================================
   DEBRIS PHYSICS
========================================================= */

function updateDebris(dt){

  for(let i=debris.length-1;i>=0;i--){

    const d=debris[i];

    d.userData.life-=dt;

    d.userData.velocity.y-=9.8*dt;

    d.position.addScaledVector(
      d.userData.velocity,
      dt
    );

    d.rotation.x +=
      d.userData.angularVelocity.x*dt;

    d.rotation.y +=
      d.userData.angularVelocity.y*dt;

    d.rotation.z +=
      d.userData.angularVelocity.z*dt;


    d.userData.velocity.multiplyScalar(
      Math.pow(.45,dt)
    );


    if(d.position.y<0){

      d.position.y=0;

      d.userData.velocity.y*=-.25;

    }


    if(d.userData.life<=0){

      scene.remove(d);

      debris.splice(i,1);

    }

  }

}


/* =========================================================
   RAIN UPDATE
========================================================= */

function updateRain(dt){

  if(weather!=="rain")return;

  for(const p of rain){

    const arr=
      p.geometry.attributes.position.array;

    for(let i=1;i<arr.length;i+=3){

      arr[i]-=
        35*dt;

      if(arr[i]<0)
        arr[i]=40;

    }

    p.geometry.attributes.position.needsUpdate=true;

  }

}


/* =========================================================
   WEATHER
========================================================= */

function applyWeather(){

  if(weather==="night"){

    scene.background=
      new THREE.Color(0x02050c);

    scene.fog=
      new THREE.FogExp2(
        0x02050c,
        .008
      );

    scene.userData.ambientIntensity=.3;

  }else if(weather==="rain"){

    scene.background=
      new THREE.Color(0x4e5963);

    scene.fog=
      new THREE.FogExp2(
        0x59636c,
        .009
      );

    scene.userData.ambientIntensity=.6;

  }else{

    scene.background=
      new THREE.Color(0x89a5bd);

    scene.fog=
      new THREE.FogExp2(
        0x89a5bd,
        .004
      );

    scene.userData.ambientIntensity=1;

  }

}


/* =========================================================
   CRASH FLASH
========================================================= */

function flashCrash(){

  const el=
    document.getElementById("flash");

  el.style.opacity=.32;

  setTimeout(()=>{
    el.style.opacity=0;
  },70);

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  if(!player)return;

  const kmh=
    Math.round(
      Math.abs(player.userData.velocity.z)*4.166
    );

  document.getElementById("speed").textContent=
    kmh;

  document.getElementById("damageHud").textContent=
    "DAMAGE "+
    Math.round(player.userData.damage)+
    "%";

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

  if(!running)return;

  paused=!paused;

  document.getElementById("pause").style.display=
    paused?"flex":"none";

}


/* =========================================================
   START
========================================================= */

async function startGame(){

  try{

    if(screen.orientation &&
       screen.orientation.lock){

      await screen.orientation.lock(
        "landscape"
      ).catch(()=>{});

    }

    if(document.documentElement.requestFullscreen){

      await document.documentElement
        .requestFullscreen()
        .catch(()=>{});

    }

  }catch(e){}


  document.getElementById("menu").style.display="none";

  document.getElementById("loading").style.display="flex";

  let progress=0;

  const timer=setInterval(()=>{

    progress+=5;

    document.getElementById("loadbar")
      .style.width=progress+"%";

    if(progress<30)
      document.getElementById("loadText")
        .textContent="BUILDING CITY...";

    else if(progress<60)
      document.getElementById("loadText")
        .textContent="GENERATING VEHICLES...";

    else if(progress<85)
      document.getElementById("loadText")
        .textContent="CALCULATING PHYSICS...";

    else
      document.getElementById("loadText")
        .textContent="READY";

    if(progress>=100){

      clearInterval(timer);

      setTimeout(
        launch,
        250
      );

    }

  },35);

}


function launch(){

  document.getElementById("loading")
    .style.display="none";

  document.getElementById("hud")
    .style.display="block";

  document.getElementById("controls")
    .style.display="block";


  initThree();

  running=true;
  paused=false;

  clock.start();

  animate();

}


/* =========================================================
   THREE INITIALIZATION
========================================================= */

function initThree(){

  scene=new THREE.Scene();

  scene.userData.ambientIntensity=1;

  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .05,
    2000
  );

  camera.position.set(
    0,
    4,
    7
  );


  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(
    Math.min(
      devicePixelRatio,
      1.7
    )
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled=true;

  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  document.body.appendChild(
    renderer.domElement
  );


  /* lighting */

  const hemi=new THREE.HemisphereLight(
    0xbdd9ff,
    0x303820,
    2
  );

  scene.add(hemi);


  const sun=new THREE.DirectionalLight(
    0xffffff,
    3
  );

  sun.position.set(
    -80,
    120,
    40
  );

  sun.castShadow=true;

  sun.shadow.mapSize.set(
    1024,
    1024
  );

  scene.add(sun);


  createWorld();

  createPlayer();

  spawnTraffic();

  createRain();

  applyWeather();

  updateCameraLabel();

  window.addEventListener(
    "resize",
    resize
  );

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  if(!renderer)return;

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  if(cockpitCamera){

    cockpitCamera.aspect=
      innerWidth/innerHeight;

    cockpitCamera.updateProjectionMatrix();

  }

}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(animate);

  if(!running)return;

  const dt=
    Math.min(
      clock.getDelta(),
      .033
    );

  if(!paused){

    updatePlayer(dt);

    updateTraffic(dt);

    updateDebris(dt);

    updateRain(dt);

    updateHUD();

  }

  /*
    Rain visibility
  */

  for(const p of rain){

    p.visible=
      weather==="rain";

  }


  /*
    World scrolling:
    only scenery moves,
    vehicle physics remain physical.
  */

  if(player){

    const dz=
      player.userData.velocity.z*dt;

    if(
      Math.abs(player.position.z)>8
    ){

      const shift=
        player.position.z;

      player.position.z=0;

      world.position.z -= shift;

      for(const car of traffic){

        car.position.z -= shift;

      }

      for(const d of debris){

        d.position.z -= shift;

      }

    }

  }


  updateCamera(dt);

}

/* =========================================================
   EXTRA COLLISION / DAMAGE POLISH
========================================================= */

function damageAnimation(car,dt){

  if(!car)return;

  const damage=
    car.userData.damage||0;

  if(damage<=0)return;

  /*
    Subtle damaged-body vibration.
  */

  if(car.userData.crashed){

    car.rotation.z +=
      Math.sin(performance.now()*.006)*
      .0008*
      damage;

  }

}


/* =========================================================
   MOBILE LANDSCAPE CHECK
========================================================= */

function landscapeCheck(){

  /*
    Orientation lock can be rejected by browsers.
    CSS overlay is therefore the fallback.
  */

  const portrait=
    innerHeight>innerWidth;

  document.getElementById(
    "rotateNotice"
  ).style.display=
    portrait
      ? "flex"
      : "none";

}

window.addEventListener(
  "resize",
  landscapeCheck
);

landscapeCheck();


/* =========================================================
   PREVENT MOBILE SCROLL / ZOOM
========================================================= */

document.addEventListener(
  "touchmove",
  e=>{

    if(running)
      e.preventDefault();

  },
  {passive:false}
);

document.addEventListener(
  "gesturestart",
  e=>{
    e.preventDefault();
  }
);
