<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>D.T.B. DRIVE</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
canvas{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
}
#menu{
  position:fixed;
  z-index:20;
  inset:0;
  background:
    radial-gradient(circle at 50% 40%,#202b35,#080b0e 55%,#000);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.logo{
  font-size:clamp(45px,9vw,100px);
  font-weight:900;
  letter-spacing:12px;
  text-shadow:0 0 25px #00aaff,0 0 60px #0066ff;
}
.title{
  margin-top:5px;
  letter-spacing:7px;
  color:#aaa;
  font-size:12px;
}
.start{
  margin-top:45px;
  width:min(360px,80vw);
  padding:18px;
  border:1px solid #4c9cff;
  border-radius:14px;
  color:white;
  background:rgba(0,120,255,.18);
  font-size:18px;
  font-weight:bold;
}
.start:active{
  transform:scale(.96);
  background:rgba(0,150,255,.45);
}
#hud{
  display:none;
  position:fixed;
  z-index:5;
  inset:0;
  color:white;
  pointer-events:none;
}
#speed{
  position:absolute;
  top:18px;
  left:20px;
  font-size:30px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}
#rpm{
  font-size:12px;
  color:#bbb;
}
#camLabel{
  position:absolute;
  top:20px;
  right:20px;
  font-size:12px;
  color:#ddd;
}
#damageBox{
  position:absolute;
  right:20px;
  top:43px;
  width:150px;
  height:8px;
  background:#222;
  border:1px solid #777;
  border-radius:10px;
}
#damageBar{
  width:0%;
  height:100%;
  background:#f22;
}
#controls{
  display:none;
  position:fixed;
  z-index:10;
  inset:0;
  pointer-events:none;
}
#wheel{
  pointer-events:auto;
  touch-action:none;
  position:absolute;
  left:25px;
  bottom:25px;
  width:145px;
  height:145px;
  border:6px solid rgba(255,255,255,.45);
  border-radius:50%;
  background:rgba(0,0,0,.3);
}
#wheel:before,
#wheel:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.55);
}
#wheel:before{
  width:5px;
  height:112px;
  left:64px;
  top:10px;
}
#wheel:after{
  width:112px;
  height:5px;
  left:10px;
  top:64px;
}
#knob{
  position:absolute;
  width:58px;
  height:58px;
  left:37px;
  top:37px;
  border:4px solid white;
  border-radius:50%;
  background:rgba(0,0,0,.25);
}
.pedal{
  pointer-events:auto;
  touch-action:none;
  position:absolute;
  right:25px;
  bottom:25px;
  width:85px;
  height:120px;
  border-radius:17px;
  border:2px solid rgba(255,255,255,.45);
  color:white;
  background:rgba(0,0,0,.4);
  font-weight:bold;
}
#brake{
  right:125px;
  height:90px;
}
.smallBtn{
  pointer-events:auto;
  position:absolute;
  right:20px;
  top:70px;
  width:70px;
  height:40px;
  border:1px solid #aaa;
  border-radius:10px;
  color:white;
  background:rgba(0,0,0,.5);
}
#camera{
  top:115px;
}
#pause{
  top:160px;
}
#pauseScreen{
  display:none;
  position:fixed;
  z-index:30;
  inset:0;
  background:rgba(0,0,0,.72);
  color:white;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
#pauseScreen h1{
  font-size:48px;
  margin-bottom:25px;
}
#resume{
  padding:15px 35px;
  background:#167bdc;
  border:0;
  color:white;
  border-radius:12px;
}
@media(max-width:600px){
  #wheel{
    width:120px;
    height:120px;
  }
  #wheel:before{
    height:92px;
    left:52px;
  }
  #wheel:after{
    width:92px;
    top:52px;
  }
  #knob{
    width:50px;
    height:50px;
    left:29px;
    top:29px;
  }
  .pedal{
    width:72px;
  }
  #brake{
    right:108px;
  }
}
</style>
</head>

<body>

<div id="menu">
  <div class="logo">D.T.B.</div>
  <div class="title">DRIVE // REAL CAR PROJECT</div>
  <button class="start" id="start">▶ DRIVE START</button>
</div>

<div id="hud">
  <div id="speed">0 KM/H<div id="rpm">RPM 800</div></div>
  <div id="camLabel">THIRD PERSON</div>
  <div id="damageBox"><div id="damageBar"></div></div>
</div>

<div id="controls">
  <div id="wheel"><div id="knob"></div></div>
  <button class="pedal" id="gas">GAS</button>
  <button class="pedal" id="brake">BRAKE</button>
  <button class="smallBtn" id="camera">CAM</button>
  <button class="smallBtn" id="pause">Ⅱ</button>
</div>

<div id="pauseScreen">
  <h1>PAUSED</h1>
  <button id="resume">CONTINUE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>
/* =========================================================
   D.T.B. DRIVE
   HIGH DETAIL PROCEDURAL HYUNDAI-STYLE SEDAN
   ========================================================= */

let scene,camera,renderer;
let car;
let wheels=[];
let traffic=[];
let particles=[];
let rain=[];
let road;
let started=false;
let paused=false;
let cameraMode=0;

let speed=0;
let steer=0;
let throttle=0;
let brake=0;
let damage=0;

let camYaw=0;
let camPitch=.18;
let camDistance=8;

const clock=new THREE.Clock();

/* -------------------- MATERIALS -------------------- */

const MAT={
  body:new THREE.MeshStandardMaterial({
    color:0x142536,
    metalness:.85,
    roughness:.24
  }),
  body2:new THREE.MeshStandardMaterial({
    color:0x1d3449,
    metalness:.9,
    roughness:.2
  }),
  black:new THREE.MeshStandardMaterial({
    color:0x050608,
    metalness:.3,
    roughness:.25
  }),
  glass:new THREE.MeshStandardMaterial({
    color:0x07131d,
    metalness:.35,
    roughness:.08,
    transparent:true,
    opacity:.72
  }),
  chrome:new THREE.MeshStandardMaterial({
    color:0xaaaaaa,
    metalness:1,
    roughness:.12
  }),
  tire:new THREE.MeshStandardMaterial({
    color:0x080808,
    roughness:.8
  }),
  rim:new THREE.MeshStandardMaterial({
    color:0x777d84,
    metalness:.95,
    roughness:.18
  }),
  light:new THREE.MeshStandardMaterial({
    color:0xffffff,
    emissive:0xffffff,
    emissiveIntensity:5
  }),
  redLight:new THREE.MeshStandardMaterial({
    color:0xff1111,
    emissive:0xff0000,
    emissiveIntensity:4
  }),
  road:new THREE.MeshStandardMaterial({
    color:0x292b2e,
    roughness:1
  }),
  line:new THREE.MeshBasicMaterial({
    color:0xffffff
  })
};

/* -------------------- INIT -------------------- */

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x8fa8ba);
  scene.fog=new THREE.Fog(0x8fa8ba,40,190);

  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .05,
    500
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  document.body.appendChild(renderer.domElement);

  const hemi=new THREE.HemisphereLight(
    0xbcd9ff,
    0x303030,
    2.1
  );

  scene.add(hemi);

  const sun=new THREE.DirectionalLight(
    0xffffff,
    3.5
  );

  sun.position.set(-40,70,35);
  sun.castShadow=true;
  sun.shadow.mapSize.width=1024;
  sun.shadow.mapSize.height=1024;
  sun.shadow.camera.left=-100;
  sun.shadow.camera.right=100;
  sun.shadow.camera.top=100;
  sun.shadow.camera.bottom=-100;

  scene.add(sun);

  createWorld();
  createCar();
  createTraffic();

  animate();
}

/* =========================================================
   WORLD
   ========================================================= */

function createWorld(){

  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    new THREE.MeshStandardMaterial({
      color:0x596258,
      roughness:1
    })
  );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;
  scene.add(ground);

  road=new THREE.Mesh(
    new THREE.PlaneGeometry(18,500),
    MAT.road
  );

  road.rotation.x=-Math.PI/2;
  road.position.y=.015;
  road.receiveShadow=true;
  scene.add(road);

  for(let z=-240;z<250;z+=8){

    const line=new THREE.Mesh(
      new THREE.BoxGeometry(.18,.025,4),
      MAT.line
    );

    line.position.set(0,.04,z);
    scene.add(line);
  }

  for(let z=-240;z<250;z+=16){

    const side1=new THREE.Mesh(
      new THREE.BoxGeometry(.12,.03,8),
      MAT.line
    );

    side1.position.set(-8,.04,z);

    const side2=side1.clone();
    side2.position.x=8;

    scene.add(side1,side2);
  }

  for(let i=0;i<80;i++){

    const h=3+Math.random()*12;
    const w=3+Math.random()*6;

    const building=new THREE.Mesh(
      new THREE.BoxGeometry(w,h,w),
      new THREE.MeshStandardMaterial({
        color:0x62666a,
        roughness:.9
      })
    );

    const side=Math.random()<.5?-1:1;

    building.position.set(
      side*(15+Math.random()*25),
      h/2,
      -240+Math.random()*480
    );

    scene.add(building);
  }
}

/* =========================================================
   DENSE CAR BODY
   ========================================================= */

function createCar(){

  car=new THREE.Group();
  car.position.set(0,.55,0);

  scene.add(car);

  /*
    MAIN BODY
    많은 단면을 연결해서 하나의 메시를 만든다.
  */

  const bodyMesh=createDenseBody();

  bodyMesh.castShadow=true;
  bodyMesh.receiveShadow=true;

  car.add(bodyMesh);

  /* lower body */

  const lower=new THREE.Mesh(
    new THREE.BoxGeometry(4.45,.48,9.5),
    MAT.body
  );

  lower.position.y=.55;
  lower.castShadow=true;
  car.add(lower);

  /* hood */

  const hood=createPanel(
    4.0,
    .38,
    3.2,
    MAT.body2
  );

  hood.position.set(0,1.03,-2.8);
  hood.rotation.x=-.04;
  car.add(hood);

  /* roof */

  const roof=createRoundedBox(
    3.65,
    .28,
    4.7,
    .18,
    MAT.body
  );

  roof.position.set(0,2.0,.35);
  roof.castShadow=true;
  car.add(roof);

  /* cabin glass */

  createCabin();

  /* doors */

  createDoors();

  /* lights */

  createLights();

  /* grille */

  createFrontGrille();

  /* bumpers */

  createBumpers();

  /* mirrors */

  createMirrors();

  /* wheels */

  createWheels();

  /* badge */

  createBadge();

  /* interior */

  createInterior();
}

/* =========================================================
   DENSE MESH
   ========================================================= */

function createDenseBody(){

  const verts=[];
  const faces=[];

  /*
    길이 방향 17개 단면
    각 단면마다 좌/우/상단/하단 정점 생성
  */

  const sections=[
    [-4.75,1.18,1.35],
    [-4.5,1.28,1.65],
    [-4.15,1.35,1.95],
    [-3.65,1.42,2.08],
    [-3.0,1.48,2.16],
    [-2.3,1.55,2.20],
    [-1.5,1.57,2.22],
    [-.7,1.58,2.24],
    [0,1.58,2.25],
    [.8,1.57,2.24],
    [1.6,1.54,2.2],
    [2.4,1.5,2.15],
    [3.15,1.46,2.05],
    [3.7,1.38,1.95],
    [4.15,1.30,1.8],
    [4.5,1.22,1.55],
    [4.75,1.16,1.3]
  ];

  for(let i=0;i<sections.length;i++){

    const z=sections[i][0];
    const h=sections[i][1];
    const width=sections[i][2];

    verts.push(
      -width, .48, z,
       width, .48, z,

      -width*1.02,h*.78,z,
       width*1.02,h*.78,z,

      -width*.92,h,z,
       width*.92,h,z,

      -width*.70,h*1.08,z,
       width*.70,h*1.08,z,

      -width*.42,h*1.12,z,
       width*.42,h*1.12,z
    );
  }

  const N=10;

  for(let i=0;i<sections.length-1;i++){

    for(let j=0;j<N-1;j++){

      const a=i*N+j;
      const b=i*N+j+1;
      const c=(i+1)*N+j;
      const d=(i+1)*N+j+1;

      faces.push(a,c,b);
      faces.push(b,c,d);
    }
  }

  const geo=new THREE.BufferGeometry();

  geo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(verts,3)
  );

  geo.setIndex(faces);
  geo.computeVertexNormals();

  const mesh=new THREE.Mesh(geo,MAT.body);

  return mesh;
}

/* =========================================================
   CABIN
   ========================================================= */

function createCabin(){

  const cabin=new THREE.Group();

  const front=createWindowPanel(
    3.05,
    1.25,
    1.7
  );

  front.position.set(0,1.9,-1.45);
  front.rotation.x=-.25;
  cabin.add(front);

  const rear=createWindowPanel(
    3.15,
    1.15,
    1.7
  );

  rear.position.set(0,1.9,1.65);
  rear.rotation.x=.16;
  cabin.add(rear);

  const sideL=createWindowPanel(
    4.1,
    1.15,
    .05
  );

  sideL.position.set(-1.78,1.85,.2);
  sideL.rotation.y=Math.PI/2;
  cabin.add(sideL);

  const sideR=sideL.clone();
  sideR.position.x=1.78;
  cabin.add(sideR);

  /* pillars */

  for(const x of [-1.72,1.72]){

    for(const z of [-1.35,0,1.55]){

      const pillar=new THREE.Mesh(
        new THREE.BoxGeometry(.11,1.35,.13),
        MAT.black
      );

      pillar.position.set(x,1.9,z);
      cabin.add(pillar);
    }
  }

  car.add(cabin);
}

function createWindowPanel(w,h,d){

  return new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    MAT.glass
  );
}

/* =========================================================
   DOORS + BODY LINES
   ========================================================= */

function createDoors(){

  for(const side of [-1,1]){

    for(let i=0;i<4;i++){

      const z=-2.25+i*1.55;

      const door=new THREE.Mesh(
        new THREE.BoxGeometry(
          .035,
          1.12,
          1.35
        ),
        MAT.body2
      );

      door.position.set(
        side*2.12,
        1.05,
        z
      );

      car.add(door);

      const crease=new THREE.Mesh(
        new THREE.BoxGeometry(
          .025,
          .035,
          1.25
        ),
        MAT.chrome
      );

      crease.position.set(
        side*2.145,
        1.35,
        z
      );

      car.add(crease);

      const handle=new THREE.Mesh(
        new THREE.BoxGeometry(
          .06,
          .06,
          .42
        ),
        MAT.chrome
      );

      handle.position.set(
        side*2.18,
        1.53,
        z+.05
      );

      car.add(handle);
    }
  }
}

/* =========================================================
   LIGHTS
   ========================================================= */

function createLights(){

  for(const side of [-1,1]){

    const head=new THREE.Mesh(
      new THREE.BoxGeometry(.75,.22,.16),
      MAT.light
    );

    head.position.set(
      side*1.48,
      1.18,
      -4.67
    );

    head.rotation.y=side*.05;

    car.add(head);

    const glow=new THREE.PointLight(
      0xffffff,
      4,
      18
    );

    glow.position.copy(head.position);
    car.add(glow);

    const tail=new THREE.Mesh(
      new THREE.BoxGeometry(.8,.2,.13),
      MAT.redLight
    );

    tail.position.set(
      side*1.48,
      1.12,
      4.67
    );

    car.add(tail);
  }
}

/* =========================================================
   GRILLE
   ========================================================= */

function createFrontGrille(){

  const grille=new THREE.Mesh(
    new THREE.BoxGeometry(2.2,.45,.12),
    MAT.black
  );

  grille.position.set(0,.91,-4.72);
  car.add(grille);

  for(let i=-5;i<=5;i++){

    const bar=new THREE.Mesh(
      new THREE.BoxGeometry(.035,.32,.035),
      MAT.chrome
    );

    bar.position.set(
      i*.19,
      .91,
      -4.80
    );

    car.add(bar);
  }
}

/* =========================================================
   BUMPERS
   ========================================================= */

function createBumpers(){

  const front=new THREE.Mesh(
    new THREE.BoxGeometry(4.35,.45,.42),
    MAT.body2
  );

  front.position.set(0,.65,-4.7);
  front.castShadow=true;
  car.add(front);

  const rear=new THREE.Mesh(
    new THREE.BoxGeometry(4.35,.45,.42),
    MAT.body2
  );

  rear.position.set(0,.65,4.7);
  rear.castShadow=true;
  car.add(rear);

  const splitter=new THREE.Mesh(
    new THREE.BoxGeometry(3.6,.13,.35),
    MAT.black
  );

  splitter.position.set(0,.48,-4.88);
  car.add(splitter);
}

/* =========================================================
   MIRRORS
   ========================================================= */

function createMirrors(){

  for(const side of [-1,1]){

    const arm=new THREE.Mesh(
      new THREE.BoxGeometry(.12,.12,.45),
      MAT.black
    );

    arm.position.set(
      side*2.15,
      1.65,
      -.95
    );

    car.add(arm);

    const mirror=new THREE.Mesh(
      new THREE.SphereGeometry(.25,.12,.8),
      MAT.body2
    );

    mirror.scale.set(.7,.7,1.2);

    mirror.position.set(
      side*2.35,
      1.72,
      -.95
    );

    car.add(mirror);
  }
}

/* =========================================================
   WHEELS
   ========================================================= */

function createWheels(){

  const positions=[
    [-1.75,.52,-2.95],
    [1.75,.52,-2.95],
    [-1.75,.52,2.95],
    [1.75,.52,2.95]
  ];

  positions.forEach((p,index)=>{

    const wheel=new THREE.Group();

    wheel.position.set(...p);

    const tire=new THREE.Mesh(
      new THREE.CylinderGeometry(
        .74,.74,.38,32
      ),
      MAT.tire
    );

    tire.rotation.z=Math.PI/2;
    tire.castShadow=true;

    wheel.add(tire);

    const rim=new THREE.Mesh(
      new THREE.CylinderGeometry(
        .45,.45,.40,24
      ),
      MAT.rim
    );

    rim.rotation.z=Math.PI/2;

    wheel.add(rim);

    const hub=new THREE.Mesh(
      new THREE.CylinderGeometry(
        .13,.13,.43,16
      ),
      MAT.black
    );

    hub.rotation.z=Math.PI/2;

    wheel.add(hub);

    for(let j=0;j<10;j++){

      const spoke=new THREE.Mesh(
        new THREE.BoxGeometry(
          .06,.43,.08
        ),
        MAT.chrome
      );

      spoke.rotation.z=j*Math.PI/5;
      spoke.rotation.y=Math.PI/2;

      wheel.add(spoke);
    }

    car.add(wheel);
    wheels.push(wheel);

    const arch=new THREE.Mesh(
      new THREE.TorusGeometry(
        .83,
        .06,
        8,
        24,
        Math.PI
      ),
      MAT.black
    );

    arch.rotation.z=Math.PI/2;
    arch.position.set(
      p[0],
      .72,
      p[2]
    );

    car.add(arch);
  });
}

/* =========================================================
   HYUNDAI STYLE BADGE
   ========================================================= */

function createBadge(){

  const badge=new THREE.Mesh(
    new THREE.CapsuleGeometry(.24,.42,8,16),
    MAT.chrome
  );

  badge.rotation.z=Math.PI/2;
  badge.rotation.x=Math.PI/2;

  badge.position.set(0,1.08,-4.85);

  car.add(badge);
}

/* =========================================================
   INTERIOR
   ========================================================= */

function createInterior(){

  const interior=new THREE.Group();

  const dash=new THREE.Mesh(
    new THREE.BoxGeometry(3.3,.5,1.2),
    MAT.black
  );

  dash.position.set(0,1.28,-1.65);
  interior.add(dash);

  const steering=new THREE.Mesh(
    new THREE.TorusGeometry(.38,.07,10,24),
    MAT.black
  );

  steering.position.set(-.75,1.48,-1.75);
  steering.rotation.y=Math.PI/2;
  interior.add(steering);

  const screen=new THREE.Mesh(
    new THREE.BoxGeometry(1.25,.5,.05),
    MAT.light
  );

  screen.material.emissiveIntensity=1.5;
  screen.position.set(0,1.55,-1.75);
  interior.add(screen);

  car.add(interior);
}

/* =========================================================
   TRAFFIC
   ========================================================= */

function createTraffic(){

  for(let i=0;i<10;i++){

    const t=new THREE.Group();

    const body=new THREE.Mesh(
      new THREE.BoxGeometry(
        2.1,
        .65,
        4.3
      ),
      new THREE.MeshStandardMaterial({
        color:new THREE.Color().setHSL(
          Math.random(),
          .55,
          .35
        ),
        metalness:.6,
        roughness:.3
      })
    );

    body.position.y=.65;
    t.add(body);

    for(const side of [-1,1]){

      for(const z of [-1.45,1.45]){

        const w=new THREE.Mesh(
          new THREE.CylinderGeometry(
            .38,.38,.25,16
          ),
          MAT.tire
        );

        w.rotation.z=Math.PI/2;
        w.position.set(side*1.05,.43,z);

        t.add(w);
      }
    }

    t.position.set(
      Math.random()<.5?-4.5:4.5,
      0,
      -40-Math.random()*170
    );

    scene.add(t);
    traffic.push(t);
  }
}

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */

function createRoundedBox(w,h,d,r,mat){

  const g=new THREE.BoxGeometry(w,h,d,4,3,6);

  const p=g.attributes.position;

  for(let i=0;i<p.count;i++){

    let x=p.getX(i);
    let y=p.getY(i);
    let z=p.getZ(i);

    const sx=Math.sign(x);
    const sy=Math.sign(y);
    const sz=Math.sign(z);

    if(
      Math.abs(x)>w/2-r &&
      Math.abs(z)>d/2-r
    ){
      x=sx*(w/2-r)+
        sx*Math.min(
          Math.abs(x)-(w/2-r),
          r
        );
    }

    p.setXYZ(i,x,y,z);
  }

  g.computeVertexNormals();

  return new THREE.Mesh(g,mat);
}

function createPanel(w,h,d,mat){

  const g=new THREE.BoxGeometry(
    w,h,d,
    12,
    3,
    12
  );

  g.computeVertexNormals();

  return new THREE.Mesh(g,mat);
}

/* =========================================================
   TOUCH
   ========================================================= */

let wheelTouch=null;

const wheelEl=document.getElementById("wheel");
const knob=document.getElementById("knob");

function updateSteer(x){

  const r=wheelEl.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=x-cx;
  let dy=0;

  const max=r.width*.38;

  dx=Math.max(-max,Math.min(max,dx));

  steer=dx/max;

  knob.style.transform=
    "translate("+dx+"px,"+dy+"px)";
}

wheelEl.addEventListener("pointerdown",e=>{
  wheelTouch=e.pointerId;
  wheelEl.setPointerCapture(e.pointerId);
  updateSteer(e.clientX);
});

wheelEl.addEventListener("pointermove",e=>{
  if(e.pointerId===wheelTouch)
    updateSteer(e.clientX);
});

wheelEl.addEventListener("pointerup",e=>{
  wheelTouch=null;
  steer*=.2;
  knob.style.transform="translate(0,0)";
});

wheelEl.addEventListener("pointercancel",()=>{
  wheelTouch=null;
  steer=0;
  knob.style.transform="translate(0,0)";
});

/* pedals */

function pedal(id,type){

  const el=document.getElementById(id);

  el.addEventListener("pointerdown",e=>{
    e.preventDefault();

    if(type==="gas") throttle=1;
    else brake=1;

    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener("pointerup",()=>{
    if(type==="gas") throttle=0;
    else brake=0;
  });

  el.addEventListener("pointercancel",()=>{
    if(type==="gas") throttle=0;
    else brake=0;
  });
}

pedal("gas","gas");
pedal("brake","brake");

/* =========================================================
   CAMERA
   ========================================================= */

document.getElementById("camera").onclick=()=>{

  cameraMode++;

  if(cameraMode>2)
    cameraMode=0;

  const names=[
    "THIRD PERSON",
    "SPORT CAMERA",
    "COCKPIT"
  ];

  document.getElementById("camLabel").textContent=
    names[cameraMode];
};

/* =========================================================
   PAUSE
   ========================================================= */

document.getElementById("pause").onclick=()=>{

  paused=true;

  document.getElementById("pauseScreen").style.display="flex";
};

document.getElementById("resume").onclick=()=>{

  paused=false;

  document.getElementById("pauseScreen").style.display="none";
};

/* =========================================================
   PHYSICS
   ========================================================= */

function updatePhysics(dt){

  if(paused)return;

  const acceleration=throttle?12:0;
  const braking=brake?20:0;

  speed+=acceleration*dt;

  speed-=2.4*dt;

  if(brake)
    speed-=braking*dt;

  speed=Math.max(0,Math.min(55,speed));

  const turnPower=
    (speed/55)*1.5;

  car.rotation.y-=steer*turnPower*dt;

  const forward=new THREE.Vector3(
    0,
    0,
    -1
  );

  forward.applyQuaternion(car.quaternion);

  car.position.addScaledVector(
    forward,
    speed*dt
  );

  car.position.x=
    THREE.MathUtils.clamp(
      car.position.x,
      -6.1,
      6.1
    );

  /* wheel steering */

  wheels[0].rotation.y=steer*.45;
  wheels[1].rotation.y=steer*.45;

  wheels.forEach(w=>{
    w.children[0].rotation.x-=speed*dt*2;
  });

  /* camera */

  updateCamera();

  /* traffic */

  traffic.forEach(t=>{

    t.position.z+=speed*dt*.65;

    if(t.position.z>20){

      t.position.z=-180-Math.random()*100;

      t.position.x=
        Math.random()<.5?-4.5:4.5;
    }

    const dx=
      Math.abs(t.position.x-car.position.x);

    const dz=
      Math.abs(t.position.z-car.position.z);

    if(dx<2.7 && dz<4){

      damage=Math.min(100,damage+35*dt);
      speed*=.96;

      car.rotation.y+=
        (Math.random()-.5)*.08;

      flashCrash();
    }
  });

  updateHUD();
}

/* =========================================================
   CAMERA UPDATE
   ========================================================= */

function updateCamera(){

  const target=car.position.clone();

  if(cameraMode===0){

    const offset=new THREE.Vector3(
      0,
      3.0,
      8.7
    );

    offset.applyQuaternion(car.quaternion);

    camera.position.lerp(
      target.clone().add(offset),
      .08
    );

    camera.lookAt(
      target.clone().add(
        new THREE.Vector3(0,1,-4)
          .applyQuaternion(car.quaternion)
      )
    );
  }

  else if(cameraMode===1){

    const offset=new THREE.Vector3(
      4.5,
      2.2,
      5.8
    );

    offset.applyQuaternion(car.quaternion);

    camera.position.lerp(
      target.clone().add(offset),
      .1
    );

    camera.lookAt(target);
  }

  else{

    const offset=new THREE.Vector3(
      -.72,
      1.62,
      -.55
    );

    offset.applyQuaternion(car.quaternion);

    camera.position.lerp(
      target.clone().add(offset),
      .15
    );

    const look=new THREE.Vector3(
      -.72,
      1.55,
      -8
    );

    look.applyQuaternion(car.quaternion);

    camera.lookAt(
      target.clone().add(look)
    );
  }
}

/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

  const kmh=Math.round(speed*3.6);

  document.getElementById("speed").firstChild.nodeValue=
    kmh+" KM/H ";

  document.getElementById("rpm").textContent=
    "RPM "+Math.round(800+speed*100);

  document.getElementById("damageBar").style.width=
    damage+"%";
}

/* =========================================================
   CRASH EFFECT
   ========================================================= */

let crashTimer=0;

function flashCrash(){

  crashTimer=.12;
}

function updateCrash(dt){

  crashTimer-=dt;

  if(crashTimer>0){

    document.body.style.filter=
      "brightness(1.5)";

  }else{

    document.body.style.filter=
      "";
  }
}

/* =========================================================
   START
   ========================================================= */

document.getElementById("start").onclick=()=>{

  if(started)return;

  started=true;

  document.getElementById("menu").style.display="none";
  document.getElementById("hud").style.display="block";
  document.getElementById("controls").style.display="block";

  if(document.documentElement.requestFullscreen){

    document.documentElement
      .requestFullscreen()
      .catch(()=>{});
  }
};

/* =========================================================
   LOOP
   ========================================================= */

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(
    clock.getDelta(),
    .05
  );

  if(started){

    updatePhysics(dt);
    updateCrash(dt);
  }

  renderer.render(scene,camera);
}

/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
});

/* =========================================================
   START ENGINE
   ========================================================= */

init();

</script>
